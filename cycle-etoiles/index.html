// ---------- Échelle et repère ----------
// Le diagramme H-R est posé dans le plan XY (z = 0), face à +Z.
// Hauteur : y = log10(L / L☉) : 1 unité = un facteur 10 de luminosité (de 10^-4,5 à 10^6 L☉).
// Largeur : x = 9 × (4,3 − log10 T) : 1 unité = 1/9 de décade de température, les étoiles chaudes à gauche
// (de 158 000 K à 2 500 K). Les tailles des boules sont indicatives (rayon en échelle logarithmique).
const KX = 9, LT0 = 4.3;
const LT_MAX = 5.2, LT_MIN = 3.4, LL_MIN = -4.5, LL_MAX = 6;
const T_SOLEIL = 5772;
const lg = Math.log10;
const X = (lt) => (LT0 - lt) * KX;
const Y = (ll) => ll;
const XG = X(LT_MAX), XD = X(LT_MIN), YB = LL_MIN, YH = LL_MAX; // bords du cadre
const rayonDe = (T, L) => Math.sqrt(L) * (T_SOLEIL / T) ** 2;   // L = 4πR²σT⁴, en unités solaires
const R_TERRE = 6371 / 695700;                                    // rayon de la Terre en R☉
const ORBITES = [["Mercure", 83.2], ["Vénus", 155.5], ["Terre", 215], ["Mars", 327.7], ["Jupiter", 1118]]; // en R☉

// ---------- Couleur d'une étoile selon sa température ----------
const TABLE_T = [[2500, 0xff7a3a], [3000, 0xff9a4a], [3500, 0xffb468], [4000, 0xffc58a], [5000, 0xffe2b8], [5800, 0xfff3dc],
  [6500, 0xfffaf2], [7500, 0xeef0ff], [10000, 0xcfdcff], [15000, 0xb4c8ff], [25000, 0x9fb6ff], [50000, 0x92abff]];
const rgb = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
function couleurT(T) {
  if (T <= TABLE_T[0][0]) return TABLE_T[0][1];
  for (let i = 1; i < TABLE_T.length; i++) {
    if (T <= TABLE_T[i][0]) {
      const [t0, c0] = TABLE_T[i - 1], [t1, c1] = TABLE_T[i], f = (lg(T) - lg(t0)) / (lg(t1) - lg(t0));
      const a = rgb(c0), b = rgb(c1);
      return a.reduce((h, v, k) => (h << 8) | Math.round(v + (b[k] - v) * f), 0);
    }
  }
  return TABLE_T[TABLE_T.length - 1][1];
}

// ---------- Mise en forme ----------
const fmt = (v, max = 0) => v.toLocaleString("fr-FR", { maximumFractionDigits: max });
/** Nombre arrondi à deux chiffres significatifs. */
function fmtNb(v) {
  const p = Math.floor(lg(v));
  if (p >= 2) return fmt(Math.round(v / 10 ** (p - 1)) * 10 ** (p - 1));
  return fmt(v, Math.max(0, 1 - p));
}
/** Âge dans l'unité de l'étoile suivie (milliards ou millions d'années), toujours avec 3 chiffres.
 *  court : sans « d'années » (libellé du curseur, qui tient ainsi sur une ligne de largeur constante). */
function fmtAge(t, court = false) {
  const milliards = TRAJETS[sim.cle].unite === 1e9, v = t / (milliards ? 1e9 : 1e6);
  const n = v < 10 ? 2 : v < 100 ? 1 : 0;
  const nombre = v.toLocaleString("fr-FR", { minimumFractionDigits: n, maximumFractionDigits: n });
  return nombre + " " + (milliards ? (v < 2 ? "milliard" : "milliards") : (v < 2 ? "million" : "millions")) + (court ? "" : " d'années");
}

// ---------- Les phases de la vie d'une étoile ----------
// couches : coupe schématique, de l'extérieur vers le centre (f = fraction du rayon affiché)

      { f: 0.15, c: COULEURS.rouge, n: "oxygène → silicium" }, { f: 0.1, c: COULEURS.violet, n: "silicium → fer" }, { f: 0.05, c: GRIS, n: "cœur de fer" }] },

  }
  for (let i = 1; i < tr.points.length; i++) tr.cum.push(tr.cum[i - 1] + tr.points[i].w);
  tr.total = tr.cum[tr.cum.length - 1];
}
/** État de l'étoile suivie à l'avancement u (0 → 1) de sa vie. */
function etatA(tr, u) {
  const s = Math.min(1, Math.max(0, u)) * tr.total;
  let i = 1;
  while (i < tr.points.length - 1 && s > tr.cum[i]) i++;
  const a = tr.points[i - 1], b = tr.points[i];
  const f = Math.min(1, Math.max(0, (s - tr.cum[i - 1]) / (tr.cum[i] - tr.cum[i - 1])));
  const e = { i, f, ph: b.ph, a, b, x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, t: a.t + (b.t - a.t) * f };
  if (a.lt !== undefined && b.lt !== undefined) {
    e.lt = a.lt + (b.lt - a.lt) * f; e.ll = a.ll + (b.ll - a.ll) * f;
    e.T = 10 ** e.lt; e.L = 10 ** e.ll; e.R = rayonDe(e.T, e.L);
  }
  return e;
}
const uDuPoint = (tr, i) => tr.cum[i] / tr.total;

const DUREE_VIE = 42; // secondes d'animation pour une vie entière

const PLAN = { x0: XG - 1.7, x1: XD + 0.5, y0: YB - 1.45, y1: YH + 1.05 };
const SUP = { "-": "⁻", 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const puissance = (k) => (k === 0 ? "1" : "10" + String(k).split("").map((c) => SUP[c]).join(""));
{
  const PX = 120, { x0, x1, y0, y1 } = PLAN;
  const W = Math.round((x1 - x0) * PX), H = Math.round((y1 - y0) * PX);
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  const px = (x) => (x - x0) * PX, py = (y) => (y1 - y) * PX;
  const u = (v) => v * PX;
  c.fillStyle = "rgba(9,14,28,0.88)"; c.fillRect(0, 0, W, H);
  // teinte des températures dans le cadre
  const g = c.createLinearGradient(px(XG), 0, px(XD), 0);
  for (let k = 0; k <= 12; k++) g.addColorStop(k / 12, rgba(couleurT(10 ** (LT_MAX - (LT_MAX - LT_MIN) * k / 12)), 0.07));
  c.fillStyle = g; c.fillRect(px(XG), py(YH), px(XD) - px(XG), py(YB) - py(YH));
  // lignes de luminosité (une par puissance de 10)
  c.lineWidth = 2; c.textBaseline = "middle"; c.textAlign = "right";
  c.font = `${u(0.3)}px Arial`;
  for (let k = -4; k <= 6; k++) {

    c.beginPath(); c.moveTo(px(XG), py(k)); c.lineTo(px(XD), py(k)); c.stroke();
    c.fillStyle = k === 0 ? css(COULEURS.ambre) : "#c4d0e0";
    c.fillText(puissance(k), px(XG) - u(0.15), py(k));
  }
  // lignes de température
  c.textAlign = "center"; c.textBaseline = "top";
  for (const T of [100000, 50000, 30000, 20000, 10000, 7000, 5000, 4000, 3000]) {
    const x = px(X(lg(T)));
    c.strokeStyle = "rgba(255,255,255,0.08)";
    c.beginPath(); c.moveTo(x, py(YH)); c.lineTo(x, py(YB)); c.stroke();
    c.fillStyle = "#c4d0e0"; c.fillText(fmt(T), x, py(YB) + u(0.15));
  }
  // titres des axes
  c.fillStyle = "#f6f9fd"; c.font = `${u(0.34)}px Arial`;
  c.fillText("Température de surface (kelvins)", px((XG + XD) / 2), py(YB) + u(0.68));
  c.font = `${u(0.27)}px Arial`; c.fillStyle = "#8b9ab0";
  c.textAlign = "left"; c.fillText("← plus chaudes", px(XG), py(YB) + u(0.72));
  c.textAlign = "right"; c.fillText("plus froides →", px(XD), py(YB) + u(0.72));
  c.save(); c.translate(px(x0) + u(0.36), py((YB + YH) / 2)); c.rotate(-Math.PI / 2);
  c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = "#f6f9fd"; c.font = `${u(0.34)}px Arial`;
  c.fillText("Luminosité (Soleil = 1)", 0, 0);
  c.restore();
  // types spectraux, au-dessus du cadre
  const TYPES = [["O", 30000, 158000], ["B", 10000, 30000], ["A", 7500, 10000], ["F", 6000, 7500], ["G", 5200, 6000], ["K", 3700, 5200], ["M", 2500, 3700]];
  const yb = py(YH) - u(0.14);
  const gb = c.createLinearGradient(px(XG), 0, px(XD), 0);
  for (let k = 0; k <= 12; k++) gb.addColorStop(k / 12, rgba(couleurT(10 ** (LT_MAX - (LT_MAX - LT_MIN) * k / 12)), 0.85));
  c.fillStyle = gb; c.fillRect(px(XG), yb - u(0.06), px(XD) - px(XG), u(0.06));
  c.textAlign = "center"; c.textBaseline = "bottom"; c.font = `bold ${u(0.38)}px Arial`;
  for (const [n, a, b] of TYPES) {
    const xa = px(X(lg(a))), xb = px(X(lg(b)));
    c.fillStyle = css(couleurT(Math.sqrt(a * b)));
    c.fillText(n, (xa + xb) / 2, yb - u(0.14));
    c.fillStyle = "rgba(255,255,255,0.35)"; c.fillRect(xa - 1, yb - u(0.16), 2, u(0.16));

  c.fillText("TYPE SPECTRAL", px(XG) + u(0.1), yb - u(0.62));
  // cadre
  c.strokeStyle = "rgba(255,255,255,0.3)"; c.lineWidth = 3;
  c.strokeRect(px(XG), py(YH), px(XD) - px(XG), py(YB) - py(YH));

  const tex = new THREE.CanvasTexture(cv);

}

const eclair = halo(COULEURS.etoile, 1); eclair.visible = false; S.scene.add(eclair);
const nebuleuse = new THREE.Group(); S.scene.add(nebuleuse);
nebuleuse.add(new THREE.Mesh(new THREE.RingGeometry(0.62, 1.0, 64), M.lumineux(COULEURS.corail, 0.35)));
nebuleuse.add(new THREE.Mesh(new THREE.RingGeometry(0.3, 0.62, 64), M.lumineux(COULEURS.froid, 0.3)));
const lblPhase = S.label("", () => new THREE.Vector3(boule.position.x, boule.position.y - boule.scale.x * 1.4 - 0.5, 0.2),
  { lumiere: true, visible: () => boule.visible || sim.etat?.ph === "sn" });

// trajet : complet (pointillés) et parcouru (trait plein)
const MAXV = 800;
const geoComplet = new THREE.BufferGeometry(); geoComplet.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAXV * 3), 3));
const geoParcouru = new THREE.BufferGeometry(); geoParcouru.setAttribute("position", new THREE.BufferAttribute(new Float32Array(MAXV * 3), 3));
const ligneComplete = new THREE.Line(geoComplet, new THREE.LineDashedMaterial({ transparent: true, opacity: 0.45, dashSize: 0.16, gapSize: 0.12, depthWrite: false }));
const ligneParcourue = new THREE.Line(geoParcouru, new THREE.LineBasicMaterial({ transparent: true, opacity: 0.95, depthWrite: false }));
for (const l of [ligneComplete, ligneParcourue]) { l.frustumCulled = false; l.renderOrder = 2; S.scene.add(l); }
let dense = [];
function construireTrajet(tr) {
  dense = [];
  for (let i = 1; i < tr.points.length; i++) {
    const a = tr.points[i - 1], b = tr.points[i], N = 16;
    if (b.lt === undefined) break; // le reste (étoile à neutrons, trou noir) n'est pas sur le diagramme
    for (let k = i === 1 ? 0 : 1; k <= N; k++) {
      const f = k / N;
      dense.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, u: (tr.cum[i - 1] + f * b.w) / tr.total });
    }
  }
  const p = geoComplet.attributes.position;
  dense.forEach((d, k) => p.setXYZ(k, d.x, d.y, 0.04));
  p.needsUpdate = true;
  geoComplet.setDrawRange(0, dense.length);
  ligneComplete.computeLineDistances();
  ligneComplete.material.color.setHex(tr.couleur);
  ligneParcourue.material.color.setHex(tr.couleur);
  anneau.material.color.setHex(tr.couleur);
}
function majParcouru(e) {
  const p = geoParcouru.attributes.position;
  let k = 0;
  while (k < dense.length && dense[k].u <= sim.u) { p.setXYZ(k, dense[k].x, dense[k].y, 0.05); k++; }
  if (e.b.lt === undefined) { geoParcouru.setDrawRange(0, k); p.needsUpdate = true; return; }
  p.setXYZ(k, e.x, e.y, 0.05);
  p.needsUpdate = true;
  geoParcouru.setDrawRange(0, k + 1);
}

function choisir(cle) {
  sim.cle = cle; sim.anim = null; sim.pause = 0;
  sim.u = cle === "soleil" ? uDuPoint(TRAJETS.soleil, 1) : 0;
  for (const [c] of BOUTONS_ETOILE) document.getElementById("r-e-" + c)?.setAttribute("aria-pressed", String(c === cle));
  const auj = document.getElementById("r-a-auj"); if (auj) auj.hidden = cle !== "soleil";
  construireTrajet(TRAJETS[cle]);
  affiche = null;
  legendePrec = "";
}

// ---------- Encart : l'étoile à cet instant ----------
const ap = S.apercu;
let legendePrec = "";
const rnd = alea(17), FILAMENTS = Array.from({ length: 70 }, () => ({ a: rnd() * 2 * Math.PI, r: 0.75 + rnd() * 0.35, l: 0.08 + rnd() * 0.2, c: rnd() < 0.5 ? COULEURS.corail : COULEURS.froid }));
function boule2D(c, x, y, r, hex, aura = true) {
  const [R, G, B] = rgb(hex);
  if (aura) {
    const h = c.createRadialGradient(x, y, r * 0.8, x, y, r * 1.5 + 8);
    h.addColorStop(0, `rgba(${R},${G},${B},0.35)`); h.addColorStop(1, `rgba(${R},${G},${B},0)`);
    c.fillStyle = h; c.beginPath(); c.arc(x, y, r * 1.5 + 8, 0, 2 * Math.PI); c.fill();
  }
  const g = c.createRadialGradient(x - r * 0.25, y - r * 0.25, 0, x, y, Math.max(r, 0.5));
  g.addColorStop(0, `rgb(${Math.min(255, R + 40)},${Math.min(255, G + 40)},${Math.min(255, B + 40)})`);
  g.addColorStop(0.75, `rgb(${R},${G},${B})`);
  g.addColorStop(1, `rgb(${Math.round(R * 0.7)},${Math.round(G * 0.6)},${Math.round(B * 0.55)})`);
  c.fillStyle = g; c.beginPath(); c.arc(x, y, Math.max(r, 0.8), 0, 2 * Math.PI); c.fill();
}
function coupe(c, x, y, r, couches, hex) {
  c.save();
  c.beginPath(); c.moveTo(x, y); c.arc(x, y, r, -Math.PI / 2, 0); c.closePath(); c.clip();
  const [R, G, B] = rgb(hex);
  c.fillStyle = `rgb(${Math.round(R * 0.45)},${Math.round(G * 0.38)},${Math.round(B * 0.35)})`;
  c.fillRect(x, y - r, r, r);
  for (const k of couches) {
    c.fillStyle = css(k.c); c.beginPath(); c.arc(x, y, Math.max(2, r * k.f), 0, 2 * Math.PI); c.fill();
  }
  c.restore();
  c.strokeStyle = "rgba(255,255,255,0.55)"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x, y - r); c.lineTo(x, y); c.lineTo(x + r, y); c.stroke();
}
function texte(c, t, x, y, align = "center", couleur = "rgba(196,208,224,0.9)", taille = 10) {
  c.font = `${taille}px Arial`; c.fillStyle = couleur; c.textAlign = align; c.textBaseline = "middle"; c.fillText(t, x, y);
}
function nebuleuse2D(c, x, y, r, alpha) {
  c.save(); c.translate(x, y); c.scale(1, 0.8);
  const g = c.createRadialGradient(0, 0, r * 0.3, 0, 0, r);
  g.addColorStop(0, rgba(COULEURS.froid, 0)); g.addColorStop(0.5, rgba(COULEURS.froid, 0.4 * alpha));
  g.addColorStop(0.78, rgba(COULEURS.corail, 0.6 * alpha)); g.addColorStop(1, rgba(COULEURS.corail, 0));
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 2 * Math.PI); c.fill();
  c.restore();
}
function dessinerEncart(e, time) {
  const cv = ap.canvas, dpr = Math.min(devicePixelRatio, 2), W = cv.clientWidth;
  if (!W) return;
  const H = Math.round(W * 0.66);
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  }
  const c = cv.getContext("2d");
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#04070e"); g.addColorStop(1, "#0c1528");
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const etroit = W < 280, cx = W / 2, cy = H / 2, Rm = Math.min(W, H) * 0.4;
  const ph = e.ph;

  if (ph === "sn") {
    const r = Rm * (0.35 + 0.9 * e.f);
    const f = c.createRadialGradient(cx, cy, 0, cx, cy, r);
    f.addColorStop(0, "rgba(255,255,255,1)"); f.addColorStop(0.25, rgba(COULEURS.etoile, 0.95));
    f.addColorStop(0.55, rgba(COULEURS.ambre, 0.6)); f.addColorStop(0.8, rgba(COULEURS.corail, 0.3)); f.addColorStop(1, rgba(COULEURS.corail, 0));
    c.fillStyle = f; c.fillRect(0, 0, W, H);
    texte(c, "≈ 1 milliard de Soleils", cx, H - 14, "center", "#f6f9fd", 11);
    return;
  }
  if (ph === "ns") {
    const rr = Rm * (0.75 + 0.35 * e.f);
    c.lineWidth = 1.5;
    for (const fl of FILAMENTS) {
      const a = fl.a, r0 = rr * fl.r, r1 = r0 * (1 + fl.l);
      c.strokeStyle = rgba(fl.c, 0.45 * (1 - 0.4 * e.f));
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 0.85); c.lineTo(cx + Math.cos(a + 0.05) * r1, cy + Math.sin(a + 0.05) * r1 * 0.85); c.stroke();
    }
    const ang = time * 2 * Math.PI * 0.4;
    for (const s of [0, Math.PI]) {
      const a = ang + s, L = Rm * 1.15, d = 0.14;
      const gb = c.createLinearGradient(cx, cy, cx + Math.cos(a) * L, cy + Math.sin(a) * L);
      gb.addColorStop(0, "rgba(255,255,255,0.75)"); gb.addColorStop(1, "rgba(207,220,255,0)");
      c.fillStyle = gb; c.beginPath(); c.moveTo(cx, cy);
      c.lineTo(cx + Math.cos(a - d) * L, cy + Math.sin(a - d) * L); c.lineTo(cx + Math.cos(a + d) * L, cy + Math.sin(a + d) * L); c.closePath(); c.fill();
    }
    boule2D(c, cx, cy, 4, 0xe6eeff);
    if (!etroit) {
      texte(c, "débris de l'explosion", 10, 14, "left");
      texte(c, "faisceaux ralentis : le pulsar du Crabe fait 30 tours par seconde", cx, H - 12, "center", "rgba(196,208,224,0.8)", 9.5);
    }
    return;
  }
  if (ph === "tn") {
    if (e.f < 0.3) { // l'étoile s'effondre
      const k = 1 - e.f / 0.3;
      boule2D(c, cx, cy, Math.max(2, Rm * 0.9 * k * k), couleurT(3800));
      return;
    }
    const al = Math.min(1, (e.f - 0.3) / 0.25), rh = Rm * 0.26;
    c.globalAlpha = al;
    const disque = (moitie) => {
      c.save(); c.translate(cx, cy); c.scale(1, 0.26);
      c.beginPath(); c.rect(-W, moitie < 0 ? -H * 4 : 0, 2 * W, H * 4); c.clip();
      const gd = c.createRadialGradient(0, 0, rh * 1.3, 0, 0, Rm * 1.05);
      gd.addColorStop(0, rgba(COULEURS.etoile, 0.95)); gd.addColorStop(0.35, rgba(COULEURS.ambre, 0.8)); gd.addColorStop(0.7, rgba(COULEURS.orange, 0.5)); gd.addColorStop(1, rgba(COULEURS.corail, 0));
      c.fillStyle = gd; c.beginPath(); c.arc(0, 0, Rm * 1.05, 0, 2 * Math.PI); c.arc(0, 0, rh * 1.3, 0, 2 * Math.PI, true); c.fill();
      for (let k = 0; k < 5; k++) { // grumeaux chauds qui tournent
        const a = time * 1.6 + k * 1.26, r = rh * (1.6 + 0.4 * k);
        c.fillStyle = rgba(COULEURS.etoile, 0.5); c.beginPath(); c.arc(Math.cos(a) * r, Math.sin(a) * r, 5, 0, 2 * Math.PI); c.fill();
      }
      c.restore();
    };
    disque(-1);
    // lumière du disque arrière déviée au-dessus du trou noir
    c.strokeStyle = rgba(COULEURS.ambre, 0.7); c.lineWidth = 3;
    c.beginPath(); c.ellipse(cx, cy, rh * 1.45, rh * 1.3, 0, Math.PI, 2 * Math.PI); c.stroke();
    c.fillStyle = "#000"; c.beginPath(); c.arc(cx, cy, rh, 0, 2 * Math.PI); c.fill();
    c.strokeStyle = rgba(COULEURS.etoile, 0.8); c.lineWidth = 1.2; c.beginPath(); c.arc(cx, cy, rh * 1.04, 0, 2 * Math.PI); c.stroke();
    disque(1);
    c.globalAlpha = 1;
    if (!etroit) {
      texte(c, "horizon : rien n'en ressort", cx, cy - rh * 1.6 - 6);
      texte(c, "disque de matière qui tombe", cx + Rm * 0.62, cy + Rm * 0.38);
    }
    return;
  }
  if (ph === "pagb" || ph === "pn") {
    const r = ph === "pagb" ? Rm * (0.15 + 0.35 * e.f) : Rm * (0.5 + 0.5 * e.f);
    nebuleuse2D(c, cx, cy, r, ph === "pagb" ? 0.5 + 0.5 * e.f : 1 - 0.55 * e.f);
    if (ph === "pagb" && e.f < 0.4) boule2D(c, cx, cy, Rm * 0.45 * (1 - e.f / 0.4) + 3, couleurT(e.T));
    boule2D(c, cx, cy, 3.5, couleurT(e.T));
    if (!etroit) {
      texte(c, "gaz éjecté", cx + r * 0.72, cy - r * 0.72);
      texte(c, "cœur nu, très chaud", cx, cy + 16);
      if (ph === "pn") texte(c, "c'est l'aspect de M57, la nébuleuse de la Lyre", cx, H - 12, "center", "rgba(196,208,224,0.8)", 9.5);
    }
    return;
  }

  // étoile entière : taille réelle comparée à une référence, et coupe schématique
  const R = e.R, hex = couleurT(e.T), couches = PH[ph].couches || [];
  let x = cx, r;
  if (R < 0.05) { // naine blanche : comparée à la Terre
    const ech = Rm * 0.6 / Math.max(R, R_TERRE);
    x = cx - W * 0.2; r = R * ech;
    boule2D(c, x, cy, r, hex);
    const xt = cx + W * 0.22, rt = R_TERRE * ech;
    const gt = c.createRadialGradient(xt - rt * 0.3, cy - rt * 0.3, 0, xt, cy, rt);
    gt.addColorStop(0, "#8fc0ea"); gt.addColorStop(1, "#2d5f8f");
    c.fillStyle = gt; c.beginPath(); c.arc(xt, cy, rt, 0, 2 * Math.PI); c.fill();
    texte(c, "Terre", xt, cy + rt + 12);
    texte(c, ph === "nbhe" ? "naine blanche d'hélium" : "naine blanche", x, cy + r + 12);
  } else if (R < 4) { // comparée au Soleil
    const ech = Rm * 0.62 / Math.max(R, 1);
    x = cx - W * 0.2; r = R * ech;
    boule2D(c, x, cy, r, hex);
    const xs = cx + W * 0.22, rs = ech;
    c.setLineDash([3, 3]); c.strokeStyle = rgba(COULEURS.ambre, 0.8); c.lineWidth = 1;
    c.beginPath(); c.arc(xs, cy, rs, 0, 2 * Math.PI); c.stroke(); c.setLineDash([]);
    texte(c, "Soleil actuel", xs, cy + rs + 12);
  } else { // géante : l'étoile au centre, avec le Soleil ou les orbites des planètes à la même échelle
    const ech = Rm * 0.85 / R;
    r = R * ech;
    boule2D(c, x, cy, r, hex);
    if (R < 60) {
      const rs = Math.max(1, ech);
      boule2D(c, 22, H - 30, rs, couleurT(5772), false);
      texte(c, "Soleil, à la même échelle", 22 + rs + 6, H - 30, "left");
    } else {
      c.setLineDash([3, 4]); c.lineWidth = 1;
      for (const [nom, o] of ORBITES) {
        const ro = o * ech;
        if (ro > Math.hypot(W, H) * 0.55) continue;
        c.strokeStyle = "rgba(196,208,224,0.55)";
        c.beginPath(); c.arc(cx, cy, ro, 0, 2 * Math.PI); c.stroke();
        if (!etroit && ro < W * 0.48 && ro > 24) texte(c, nom, cx - ro * 0.94, cy + ro * 0.34 + 2, "center", "rgba(232,238,246,0.95)", 9.5);
      }
      c.setLineDash([]);
      if (!etroit) texte(c, "orbites des planètes, à la même échelle", 8, H - 10, "left", "rgba(196,208,224,0.8)", 9.5);
    }
  }
  if (couches.length && r > 16) {
    coupe(c, x, cy, r, couches, hex);
    if (!etroit) {
      let yl = 12;
      for (const k of couches.slice().reverse()) {
        c.fillStyle = css(k.c); c.beginPath(); c.arc(12, yl, 4, 0, 2 * Math.PI); c.fill();
        texte(c, k.n, 21, yl, "left", "rgba(232,238,246,0.95)", 9.5);
        yl += 14;
      }
      texte(c, "coupe schématique, cœur agrandi", W - 8, H - 10, "right", "rgba(139,154,176,0.9)", 9);
    }
  }
}
function legendeEncart(e) {
  const tr = TRAJETS[sim.cle], ph = PH[e.ph];
  let chiffres;
  if (e.ph === "sn") chiffres = `${fmtAge(e.t)} · ≈ 1 milliard de L☉ pendant quelques semaines`;
  else if (e.ph === "ns") chiffres = `≈ 1,4 M☉ · ≈ 20 km de diamètre · ≈ 1 million de K, rayonne surtout en X`;
  else if (e.ph === "tn") chiffres = `≈ 10 M☉ · horizon de ≈ 30 km de rayon · aucune lumière propre`;
  else chiffres = `${fmtAge(e.t)} · ${fmtNb(e.T)} K · ${fmtNb(e.L)} L☉ · ${fmtNb(e.R)} R☉`;
  const t = tr.aujourdhui !== undefined && Math.abs(e.t - tr.points[tr.aujourdhui].t) < 5e7 ? " (aujourd'hui)" : "";
  return `<h2>${ph.nom}${t}</h2><p class="spec">${chiffres}</p><p>${ph.texte}</p><p class="spec">Durée de cette phase : ${tr.durees[e.ph]}</p>`;
}

// ---------- Animation ----------
let affiche = null, tPrec = 0;
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function recaler() {
  const v = Math.round(sim.u * 1000);
  if (v === affiche) return;
  affiche = v; pilote = true; S.regler("age", v); pilote = false;
}
S.onFrame(({ dt, time }) => {
  const dtt = time - tPrec; tPrec = time;
  if (sim.anim) {
    sim.anim.t = S.reduced ? 1 : Math.min(1, sim.anim.t + dt / 1.4);
    sim.u = sim.anim.de + (sim.anim.vers - sim.anim.de) * ease(sim.anim.t);
    if (sim.anim.t >= 1) sim.anim = null;
  } else if (dtt > 0) {
    if (sim.u >= 1) { sim.pause += dtt; if (sim.pause > 8) { sim.u = 0; sim.pause = 0; } }
    else sim.u = Math.min(1, sim.u + dtt / DUREE_VIE);
  }
  recaler();
  const tr = TRAJETS[sim.cle], e = etatA(tr, sim.u);
  sim.etat = e;

  // étoile suivie
  const horsDiagramme = e.ph === "ns" || e.ph === "tn" || e.ph === "sn";
  boule.visible = anneau.visible = haloSuivie.visible = !horsDiagramme;
  if (!horsDiagramme) {
    const col = couleurT(e.T), s = tailleBoule(e.R) * 1.25;
    boule.material.color.setHex(col);
    boule.position.set(e.x, e.y, 0.14); boule.scale.setScalar(s);
    anneau.position.set(e.x, e.y, 0.15); anneau.scale.setScalar(s);
    haloSuivie.material.color.setHex(col); haloSuivie.position.set(e.x, e.y, 0.14); haloSuivie.scale.setScalar(s * 7);
  } else boule.position.set(e.x, Math.min(e.y, YH + 0.4), 0.14);
  // éclair de la supernova
  eclair.visible = e.ph === "sn" || (e.ph === "ns" && e.f < 0.25);
  if (eclair.visible) {
    const sn = tr.points.find((p) => p.ph === "sn");
    const k = e.ph === "sn" ? e.f : 1 - e.f / 0.25;
    eclair.position.set(sn.x, YH + 0.2, 0.3);
    eclair.scale.setScalar(1 + 7 * k);
    eclair.material.opacity = 0.35 + 0.65 * k;
  }
  // nébuleuse planétaire autour du cœur nu
  nebuleuse.visible = e.ph === "pagb" || e.ph === "pn";
  if (nebuleuse.visible) {
    nebuleuse.position.set(e.x, e.y, 0.1);
    nebuleuse.scale.setScalar(e.ph === "pagb" ? 0.2 + 0.4 * e.f : 0.6 + 0.6 * e.f);
    for (const m of nebuleuse.children) m.material.opacity = (m === nebuleuse.children[0] ? 0.35 : 0.3) * (e.ph === "pn" ? 1 - 0.6 * e.f : 1);
  }
  ns.group.visible = e.ph === "ns";
  tn.group.visible = e.ph === "tn" && e.f > 0.3;
  pivotNS.rotation.y = time * 2 * Math.PI * 0.4;
  disqueTN.rotation.z = time * 0.8;

  const nom = PH[e.ph].nom;
  if (lblPhase.el.textContent !== nom) lblPhase.el.textContent = nom;
  majParcouru(e);
  ligneComplete.visible = S.state.trajet;

  // affichages
  etoilesGrp.visible = S.state.etoiles;
  regionsGrp.visible = S.state.regions;
  rayonsGrp.visible = S.state.rayons;
  for (const r of REGIONS) {
    const on = S.state.selected === r.id ? 2 : S.state.hovered === r.id ? 1 : 0;
    r.fond.material.color.setHex(on ? COULEURS.accent : 0xffffff);
    r.fond.material.opacity = [0.05, 0.12, 0.18][on];
  }
  for (const z of zonesAxes) {
    const id = z.userData.partId, on = S.state.selected === id ? 2 : S.state.hovered === id ? 1 : 0;
    z.material.opacity = [0.001, 0.08, 0.12][on];
  }
  for (const et of ETOILES) et.boule.scale.setScalar(S.state.selected === et.id || S.state.hovered === et.id ? 1.5 : 1);

  dessinerEncart(e, time);
  const html = legendeEncart(e);
  if (html !== legendePrec) { ap.legende.innerHTML = html; legendePrec = html; }
});

S.start();
choisir("soleil");
</script>
