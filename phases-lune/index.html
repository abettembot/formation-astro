<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phases de la Lune</title>
<meta name="description" content="Schéma 3D interactif des phases de la Lune : Soleil, Terre et Lune vus de dessus, la Lune vue par un observateur terrestre, et le vocabulaire des phases (croissant, quartier, gibbeuse).">
<link rel="stylesheet" href="../commun/charte.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import { createSchema, THREE, COULEURS, materiaux as M, axeX, axeZ, mesh, textureHalo, legende, css, alea, textures } from "../commun/schema.js";

// ---------- Échelle et constantes ----------
// Schéma NON proportionnel. Terre à l'échelle 1 unité = 4 000 km (rayon 1,6) ;
// Lune grossie (vrai rayon : 0,43), orbite très raccourcie (vraie distance : 96 unités),
// Soleil symbolique, beaucoup trop près et trop petit.
// Repère vu de dessus, depuis le pôle Nord : +X à droite, −Z en haut. Les angles sont comptés
// depuis +X dans le sens inverse des aiguilles d'une montre (sens de rotation de la Terre
// et de révolution de la Lune). Le Soleil est à gauche (angle 180°).
const DEG = Math.PI / 180;
const LUNAISON = 29.53;              // jours entre deux nouvelles lunes
const R_TERRE = 1.6, R_LUNE = 0.6, R_ORBITE = 8;
const X_SOLEIL = -19, R_SOLEIL = 3.2;
const X_RAYONS = X_SOLEIL + R_SOLEIL + 0.4, X_FIN = 13.5;
const VITESSE = 4;                   // heures simulées par seconde (« Temps qui passe »)

// ---------- État : âge de la Lune (jours) et heure solaire de l'observateur ----------
const sim = { age: 7.4, heure: 20, anim: null };
const wrap = (a) => ((((a + 180) % 360) + 360) % 360) - 180;         // → [−180, 180[
const mod = (v, m) => ((v % m) + m) % m;
const elongation = () => (sim.age / LUNAISON) * 360;                    // 0 = nouvelle lune, 180 = pleine
const angleLune = () => 180 + elongation();                             // en degrés
const angleObs = () => 180 + (sim.heure - 12) * 15;                     // midi : face au Soleil
const dir = (aDeg, r = 1, out = new THREE.Vector3()) => out.set(Math.cos(aDeg * DEG) * r, 0, -Math.sin(aDeg * DEG) * r);
/** Écart d'un astre au zénith de l'observateur (degrés), positif vers l'est. Hauteur = 90 − |écart|. */
const ecart = (aDeg) => wrap(aDeg - angleObs());

// ---------- Les phases ----------
const PHASES = [
  { id: "nl", nom: "Nouvelle lune", age: 0, heure: 12,
    desc: "La Lune passe entre la Terre et le Soleil : sa moitié éclairée nous tourne le dos. Elle se lève et se couche avec le Soleil, on ne la voit pas." },
  { id: "pc", nom: "Premier croissant", age: 4, heure: 19.5,
    desc: "Un fin croissant éclairé à droite, bas à l'ouest juste après le coucher du Soleil. On devine souvent le reste du disque : c'est la lumière cendrée." },
  { id: "pq", nom: "Premier quartier", age: 7.38, heure: 20,
    desc: "La moitié droite du disque est éclairée. La Lune est à 90° du Soleil : haute au coucher du Soleil, elle se couche vers minuit." },
  { id: "gc", nom: "Gibbeuse croissante", age: 11, heure: 22,
    desc: "Plus de la moitié du disque est éclairée, et cette partie grandit. Visible dès l'après-midi et une bonne partie de la nuit." },
  { id: "pl", nom: "Pleine lune", age: 14.77, heure: 0,
    desc: "La Lune est à l'opposé du Soleil : toute sa face visible est éclairée. Elle se lève au coucher du Soleil et reste visible toute la nuit." },
  { id: "gd", nom: "Gibbeuse décroissante", age: 18.5, heure: 3,
    desc: "Plus de la moitié est éclairée, mais la partie éclairée diminue, à gauche désormais. La Lune se lève dans la soirée et reste visible jusqu'au matin." },
  { id: "dq", nom: "Dernier quartier", age: 22.15, heure: 5,
    desc: "La moitié gauche est éclairée. La Lune se lève vers minuit et est haute au lever du Soleil : on la voit aussi le matin, en plein jour." },
  { id: "dc", nom: "Dernier croissant", age: 25.5, heure: 5,
    desc: "Un fin croissant éclairé à gauche, bas à l'est juste avant le lever du Soleil." },
];
function phaseDe(E) {
  if (E < 6 || E >= 354) return PHASES[0];
  return PHASES[[84, 96, 174, 186, 264, 276, 354].findIndex((b) => E < b) + 1];
}
function allerA(p) {
  const dAge = mod(p.age - sim.age + LUNAISON / 2, LUNAISON) - LUNAISON / 2;
  const dH = mod(p.heure - sim.heure + 12, 24) - 12;
  sim.anim = { age: sim.age, heure: sim.heure, dAge, dH, t: 0 };
}
const fmtHeure = (v) => { const m = Math.round(mod(v, 24) * 60) % 1440; return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}`; };
const fmt1 = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });

let pilote = false; // vrai quand le script recale les curseurs (onInput ne doit rien changer)
const S = createSchema({
  surtitre: "Support de formation · Mécanique céleste",
  titre: "Phases de la Lune",
  sousTitre: "Lunaison de 29,5 jours · vue de l'hémisphère Nord",
  distanceMax: 140,
  aide: "Glisser la Lune ou la Terre : les déplacer · Glisser ailleurs : tourner la vue · Molette ou pincer : zoomer · Cliquer un élément : l'expliquer",
  apercu: { titre: "Vu par l'observateur" },
  commandes: [
    { type: "curseur", id: "age", label: "Âge de la Lune", min: 0, max: 29.5, pas: 0.1, valeur: sim.age,
      format: (v) => fmt1(v) + " j", onInput: (v) => { if (!pilote) { sim.age = v; sim.anim = null; } } },
    { type: "curseur", id: "heure", label: "Heure", min: 0, max: 24, pas: 0.25, valeur: sim.heure,
      format: fmtHeure, onInput: (v) => { if (!pilote) { sim.heure = v; sim.anim = null; } } },
    { type: "raccourcis", id: "phases", label: "Aller à la phase", boutons: PHASES.map((p) => ({ id: p.id, label: p.nom, onClick: () => allerA(p) })) },
    { type: "bascule", id: "temps", label: "Temps qui passe", actif: false },
    { type: "bascule", id: "rayons", label: "Rayons", actif: true },
    { type: "bascule", id: "moities", label: "Moitiés", actif: true },
    { type: "bascule", id: "horizon", label: "Horizon", actif: true },
    { type: "bascule", id: "noms", label: "Noms des phases", actif: true },
  ],
  vues: [
    // sur téléphone (écran en hauteur), on monte assez haut pour voir toute l'orbite en largeur
    { id: "dessus", label: "Dessus", exacte: true,
      pos: () => innerWidth < 760 ? [0, Math.max(60, 25 / (0.69 * innerWidth / (innerHeight * 1.4))), 0.01] : [1.5, 46, 0.01],
      cible: () => innerWidth < 760 ? [0, 0, 0] : [1.5, 0, 0] },
    { id: "iso", label: "3/4", pos: [9, 15, 21], cible: [-4, -1, 0] },
    { id: "proche", label: "Terre et Lune", pos: [2, 27, 0.01], cible: [2, 0, 0] },
    // depuis la surface de la Terre, face à la Lune : on voit sa phase en 3D
    { id: "terre", label: "Depuis la Terre", fov: 28, exacte: true, suivre: true,
      pos: () => dir(angleLune(), R_TERRE + 0.2), cible: () => dir(angleLune(), R_ORBITE) },
  ],
  intro: () => `
    <div class="eyebrow">Le principe</div>
    <p>La Lune ne produit pas de lumière : elle renvoie celle du Soleil, qui éclaire toujours une moitié de la Lune. En 29,5 jours, la Lune fait le tour de la Terre. Selon sa position, nous voyons une part plus ou moins grande de sa moitié éclairée : ce sont les phases.</p>
    ${legende([
      { couleur: COULEURS.etoile, texte: "Arc clair : la moitié de la Lune éclairée par le Soleil. Elle est toujours tournée vers le Soleil." },
      { couleur: COULEURS.corail, texte: "Arc corail : la moitié tournée vers la Terre, la seule que nous voyons." },
      { couleur: COULEURS.ambre, texte: "Ce que nous voyons éclairé, c'est la partie commune aux deux moitiés. Comparez avec l'encart « Vu par l'observateur »." },
    ])}
    <p>Glissez la Lune sur son orbite, ou utilisez les raccourcis de phase. Faites tourner la Terre (curseur « Heure ») : la Lune se lève et se couche comme le Soleil, et n'est visible que lorsqu'elle est au-dessus de l'horizon de l'observateur. Le point de vue « Depuis la Terre » montre la Lune en 3D telle qu'on la voit d'ici.</p>
    <div class="eyebrow">Les mots des phases</div>
    <dl class="glossaire">
      <dt>Lunaison</dt>
      <dd>Le cycle complet des phases, d'une nouvelle lune à la suivante : 29,5 jours. L'âge de la Lune compte les jours depuis la dernière nouvelle lune.</dd>
      <dt>Croissante, décroissante</dt>
      <dd>Croissante : la partie éclairée grandit, de la nouvelle lune à la pleine lune. Décroissante : elle diminue ensuite, jusqu'à la nouvelle lune suivante.</dd>
      <dt>Croissant</dt>
      <dd>Moins de la moitié du disque est éclairée : on voit un arc lumineux, plus ou moins fin.</dd>
      <dt>Quartier, ou « demi-lune »</dt>
      <dd>La moitié du disque est éclairée. On voit bien un demi-disque, mais on parle de quartier car la Lune a parcouru un quart (premier quartier) ou trois quarts (dernier quartier) de son tour.</dd>
      <dt>Gibbeuse</dt>
      <dd>Plus de la moitié du disque est éclairée, sans qu'il soit plein. Du latin <i>gibbus</i>, « bossu » : la Lune paraît bombée.</dd>
      <dt>Terminateur</dt>
      <dd>La limite entre la partie éclairée et la partie sombre. Les reliefs y font de longues ombres : c'est là qu'on voit le mieux les cratères au télescope.</dd>
      <dt>Lumière cendrée</dt>
      <dd>La faible lueur de la partie sombre, bien visible autour d'un fin croissant. C'est la lumière du Soleil renvoyée par la Terre vers la Lune.</dd>
      <dt>« La Lune est menteuse »</dt>
      <dd>Dans l'hémisphère Nord, la Lune croissante est éclairée à droite et dessine un D, comme « décroît » ; la Lune décroissante dessine un C, comme « croît ».</dd>
      <dt>Montante, descendante</dt>
      <dd>À ne pas confondre avec croissante et décroissante : ces mots décrivent la hauteur de la Lune dans le ciel au fil du mois, pas sa phase.</dd>
    </dl>
    <p class="spec">Schéma non proportionnel : la Lune est en réalité à 30 diamètres terrestres, le Soleil 390 fois plus loin. L'observateur est placé dans le plan de l'orbite.</p>`,
});

// ---------- Éclairage : une seule source, le Soleil, à gauche ----------
// Ses rayons arrivent parallèles : une lumière directionnelle venant de −X.
S.lumieres.principale.position.set(-1, 0, 0);
S.lumieres.principale.intensity = 3.2;
S.lumieres.contre.intensity = 0;
S.lumieres.ambiance.intensity = 0.25; // à peine de quoi deviner les faces de nuit
S.scene.environment = null;          // pas d'éclairage d'ambiance venu de partout : la face de nuit reste sombre

// ---------- Textures dessinées (communes, dans schema.js) ----------
const FACE = textures.faceLune();

// ---------- Soleil ----------
const soleil = S.part("soleil", "Soleil", {
  ancre: [X_SOLEIL, 0, -R_SOLEIL - 0.2],
  texte: "Il éclaire toujours la moitié de la Lune tournée vers lui, comme la moitié de la Terre où il fait jour. Il est si loin que ses rayons arrivent pratiquement parallèles. Ici, il est dessiné beaucoup trop près et trop petit.",
  chiffres: "Distance : 150 millions de km · diamètre : 1,39 million de km · sa lumière met 8 min 20 s pour nous parvenir",
});
S.add(soleil, mesh(new THREE.SphereGeometry(R_SOLEIL, 48, 24), M.lumineux(0xffd98a), X_SOLEIL, 0, 0));
{
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: textureHalo(), color: COULEURS.ambre, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.position.set(X_SOLEIL, 0, 0); halo.scale.setScalar(R_SOLEIL * 4.2);
  S.scene.add(halo);
}

// ---------- Terre (tourne sur elle-même) et observateur ----------
const terre = new THREE.Group();
S.scene.add(terre);
const pTerre = S.part("terre", "Terre", {
  parent: terre, etiquette: false,
  texte: "Vue ici depuis le dessus du pôle Nord. Elle tourne sur elle-même en 24 heures, dans le sens inverse des aiguilles d'une montre : d'ouest en est. La moitié tournée vers le Soleil est dans le jour, l'autre dans la nuit. Cette rotation fait se lever et se coucher la Lune, comme le Soleil.",
  chiffres: "Diamètre : 12 742 km · un tour en 24 h par rapport au Soleil · axe incliné de 23,4° (non représenté)",
});
S.add(pTerre, mesh(new THREE.SphereGeometry(R_TERRE, 64, 32), M.astre(textures.terre())));
S.label("Terre", () => new THREE.Vector3(0, 0, -R_TERRE - 0.1), { partId: "terre" });

const obs = S.part("observateur", "Observateur", {
  parent: terre, etiquette: false,
  texte: "Il ne voit que la moitié du ciel située au-dessus de son horizon (trait gris). Sa place sur la Terre donne l'heure : midi face au Soleil, minuit à l'opposé, 18 h au coucher du Soleil. L'encart montre ce qu'il voit, tourné vers le sud : l'est à gauche, l'ouest à droite.",
  chiffres: "Heure solaire · 15° de rotation par heure · la Lune passe au sud environ 50 min plus tard chaque jour",
});
{ // petit bonhomme debout sur la Terre, la tête vers son zénith (+X local)
  const mat = M.lumineux(0xf6f9fd), R = R_TERRE;
  for (const s of [-1, 1]) {
    const jambe = mesh(axeX(new THREE.CylinderGeometry(0.035, 0.035, 0.36, 8)), mat, R + 0.17, 0, s * 0.06);
    jambe.rotation.y = s * 0.18; S.add(obs, jambe);
    const bras = mesh(axeX(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8)), mat, R + 0.44, 0, s * 0.11);
    bras.rotation.y = s * 0.55; S.add(obs, bras);
  }
  S.add(obs, mesh(axeX(new THREE.CylinderGeometry(0.06, 0.05, 0.3, 10)), mat, R + 0.48, 0, 0));
  S.add(obs, mesh(new THREE.SphereGeometry(0.1, 16, 12), mat, R + 0.72, 0, 0));
}
const pointObs = (h = R_TERRE + 0.72) => dir(angleObs(), h);
S.label("Observateur", () => pointObs(R_TERRE + 0.9), { partId: "observateur" });

// ---------- Lune (révolution et rotation synchrone) ----------
const lune = new THREE.Group();
S.scene.add(lune);
const pLune = S.part("lune", "Lune", {
  parent: lune, etiquette: false,
  texte: "Elle tourne autour de la Terre dans le même sens que la Terre tourne sur elle-même. Elle tourne aussi sur elle-même en un tour d'orbite : elle nous montre donc toujours la même face, avec ses taches sombres, les mers. Son orbite est inclinée de 5° : le plus souvent, elle passe au-dessus ou au-dessous de l'ombre de la Terre, d'où l'absence d'éclipse à chaque pleine lune.",
  chiffres: "Diamètre : 3 474 km · distance : 384 400 km · un tour en 27,3 j par rapport aux étoiles · 29,5 j entre deux nouvelles lunes",
});
S.add(pLune, mesh(new THREE.SphereGeometry(R_LUNE, 48, 24), M.astre(textures.lune())));
S.label("Lune", () => lune.position.clone().add(new THREE.Vector3(0, 0, -R_LUNE - 0.1)), { partId: "lune" });

// les deux moitiés : éclairée (vers le Soleil) et visible (vers la Terre)
const anneau = (r1, r2, debut, couleur) => {
  const g = new THREE.RingGeometry(r1, r2, 48, 1, debut * DEG, Math.PI); g.rotateX(-Math.PI / 2); // plan XZ, angles du repère
  return mesh(g, M.lumineux(couleur, 0.85));
};
const moitieEclairee = anneau(R_LUNE + 0.1, R_LUNE + 0.18, 90, COULEURS.etoile);   // côté −X : vers le Soleil
const moitieVisible = anneau(R_LUNE + 0.26, R_LUNE + 0.34, -90, COULEURS.corail);  // côté +X local : vers la Terre
S.scene.add(moitieEclairee); lune.add(moitieVisible);

/** Vue « Depuis la Terre » (champ étroit) : on masque les repères vus par la tranche. */
const depuisTerre = () => S.camera.fov < 32;

// ---------- Orbite et noms des phases ----------
const orbite = (() => {
  const pts = [];
  for (let i = 0; i <= 128; i++) pts.push(dir(i / 128 * 360, R_ORBITE));
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineDashedMaterial({ color: 0x8b9ab0, dashSize: 0.3, gapSize: 0.25, transparent: true, opacity: 0.45, depthWrite: false }));
  l.computeLineDistances(); S.scene.add(l);
  return l;
})();
for (const p of PHASES) {
  const a = 180 + p.age / LUNAISON * 360, r = R_ORBITE + 1.9 + 1.6 * Math.abs(Math.cos(a * DEG));
  const L = S.label(p.nom, () => dir(a, r), { visible: () => S.state.noms && !depuisTerre() });
  L.el.title = "Amener la Lune en " + p.nom.toLowerCase();
  L.el.addEventListener("click", () => allerA(p));
}

// ---------- Rayons du Soleil : lignes parallèles et grains de lumière ----------
const ZR = Array.from({ length: 19 }, (_, i) => -9 + i);
const NP = 5;
const rayons = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(ZR.length * 6), 3)),
  new THREE.LineBasicMaterial({ color: COULEURS.etoile, transparent: true, opacity: 0.16, depthWrite: false }));
const grains = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(ZR.length * NP * 3), 3)),
  new THREE.PointsMaterial({ size: 0.45, map: textureHalo(), color: COULEURS.ambre, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
rayons.frustumCulled = grains.frustumCulled = false;
S.scene.add(rayons, grains);
S.label("Rayons du Soleil", () => new THREE.Vector3(X_RAYONS + 2.2, 0, -9), { lumiere: true, visible: () => S.state.rayons && !depuisTerre() });
/** Abscisse où le rayon de cote z rencontre la Terre ou la Lune (ombre au-delà). */
function finRayon(z) {
  let x = X_FIN;
  for (const [c, r] of [[terre.position, R_TERRE], [lune.position, R_LUNE]]) {
    const dz = z - c.z;
    if (Math.abs(dz) < r) x = Math.min(x, c.x - Math.sqrt(r * r - dz * dz));
  }
  return x;
}

// ---------- Horizon de l'observateur et ligne de visée ----------
const ligne = (couleur, opacite, n = 2) => {
  const l = new THREE.Line(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3)),
    new THREE.LineBasicMaterial({ color: couleur, transparent: true, opacity: opacite, depthWrite: false }));
  l.frustumCulled = false; S.scene.add(l); return l;
};
const setLigne = (l, pts) => { const a = l.geometry.attributes.position; pts.forEach((p, i) => a.setXYZ(i, p.x, p.y, p.z)); a.needsUpdate = true; };
const lHorizon = ligne(0xc4d0e0, 0.5), lVisee = ligne(COULEURS.ambre, 0.6);
const versEst = () => { const a = angleObs() * DEG; return new THREE.Vector3(-Math.sin(a), 0, -Math.cos(a)); };
S.label("Est", () => pointObs(R_TERRE).addScaledVector(versEst(), 6.2), { visible: () => S.state.horizon && !depuisTerre() });
S.label("Ouest", () => pointObs(R_TERRE).addScaledVector(versEst(), -6.2), { visible: () => S.state.horizon && !depuisTerre() });

// ---------- Glisser la Lune ou la Terre avec la souris ou le doigt ----------
{
  const cv = S.renderer.domElement, ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  const plan = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), pt = new THREE.Vector3();
  let glisse = null;
  const viser = (e) => {
    const r = cv.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, S.camera);
  };
  // phase de capture : passe avant OrbitControls, qu'on désactive pendant le glisser
  cv.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    viser(e);
    glisse = ray.intersectObject(lune, true).length ? "lune" : ray.intersectObject(terre, true).length ? "terre" : null;
    if (!glisse) return;
    S.controls.enabled = false; sim.anim = null;
    cv.setPointerCapture(e.pointerId);
  }, { capture: true });
  cv.addEventListener("pointermove", (e) => {
    if (!glisse) return;
    viser(e);
    if (!ray.ray.intersectPlane(plan, pt)) return;
    const a = Math.atan2(-pt.z, pt.x) / DEG;
    if (glisse === "lune") sim.age = mod(a - 180, 360) / 360 * LUNAISON;
    else sim.heure = mod((a - 180) / 15 + 12, 24);
  });
  const lacher = () => { if (glisse) { glisse = null; S.controls.enabled = true; } };
  cv.addEventListener("pointerup", lacher);
  cv.addEventListener("pointercancel", lacher);
}

// ---------- Encart : la Lune vue par l'observateur ----------
const ap = S.apercu;
/** Contour de la partie éclairée d'un disque (E : élongation en degrés ; éclairé à droite si croissante). */
function cheminPhase(ctx, x, y, r, E) {
  const k = Math.cos(E * DEG), rx = Math.abs(k) * r;
  ctx.save(); ctx.translate(x, y); if (E > 180) ctx.scale(-1, 1);
  ctx.beginPath();
  ctx.arc(0, 0, r, -Math.PI / 2, Math.PI / 2, false);                                  // bord éclairé
  if (k > 0) ctx.ellipse(0, 0, rx, r, 0, Math.PI / 2, -Math.PI / 2, true);             // croissant : terminateur côté éclairé
  else ctx.ellipse(0, 0, rx, r, 0, Math.PI / 2, 3 * Math.PI / 2, false);               // gibbeuse : terminateur côté sombre
  ctx.restore();
}
function dessinerLune(ctx, x, y, r, E, sombre) {
  ctx.save();
  if (sombre > 0) { ctx.globalAlpha = sombre; ctx.drawImage(FACE, x - r, y - r, 2 * r, 2 * r); ctx.globalAlpha = 1; } // lumière cendrée
  cheminPhase(ctx, x, y, r, E); ctx.clip();
  ctx.drawImage(FACE, x - r, y - r, 2 * r, 2 * r);

const melange = (a, b, t) => `rgb(${[16, 8, 0].map((s) => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t)).join(",")})`;

  if (!W) return;

// ---------- Animation ----------
