<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Éclipse de Lune</title>
<meta name="description" content="Schéma 3D interactif des éclipses de Lune : ombre et pénombre de la Terre, éclipses pénombrale, partielle et totale, et teinte rouge de la Lune due à l'atmosphère terrestre.">
<link rel="stylesheet" href="../commun/charte.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import { createSchema, THREE, COULEURS, materiaux as M, axeX, mesh, textureHalo, legende, css, alea, textures, troncCone, vider } from "../commun/schema.js";

// ---------- Échelle et constantes ----------
// Schéma NON proportionnel. Terre à l'échelle 1 unité = 4 000 km (rayon 1,6) ;
// Lune un peu grossie (vrai rayon : 0,43), distance Terre-Lune très raccourcie, Soleil symbolique.
// Les rayons du Soleil arrivent parallèles, de −X vers +X. Les pentes des cônes sont choisies pour que,
// à la distance de la Lune, l'ombre et la pénombre gardent leur vraie taille par rapport à la Lune :
// rayon de l'ombre = 2,7 rayons lunaires, rayon de la pénombre = 4,8 rayons lunaires.
const DEG = Math.PI / 180;
const R_TERRE = 1.6, R_LUNE = 0.45, D = 8;
const RU = 2.7 * R_LUNE, RP = 4.8 * R_LUNE;                  // ombre et pénombre à la distance de la Lune
const PENTE_O = (R_TERRE - RU) / D, PENTE_P = (RP - R_TERRE) / D;
const X_SOLEIL = -19, R_SOLEIL = 3.2, X_RAYONS = X_SOLEIL + R_SOLEIL + 0.4, X_FIN = 12;
const MIN_PAR_UNITE = 28 / R_LUNE;  // la Lune avance d'un rayon lunaire en 28 minutes environ
const XMAX = RP + R_LUNE + 0.25;    // écart de départ et d'arrivée
const DUREE = 30;                   // secondes pour un déroulement complet avec « Temps qui passe »

// Les trois cas : b, hauteur de la Lune au-dessus de l'axe de l'ombre (elle passe au nord de son centre)
const TYPES = {
  penombrale: { nom: "Pénombrale", b: 1.95 },
  partielle: { nom: "Partielle", b: 1.2 },
  totale: { nom: "Totale", b: 0.35 },
};
const sim = { type: "totale", u: 0.3, anim: null, pause: 0 };
const T = () => TYPES[sim.type];
const contact = (r) => (T().b < r ? Math.sqrt(r * r - T().b ** 2) : null);  // écart quand la Lune est à r du centre de l'ombre
const C = () => ({ p: contact(RP + R_LUNE), u1: contact(RU + R_LUNE), u2: contact(RU - R_LUNE) });
/** Écart horizontal Lune-ombre (unités) ; positif : Lune à droite, à l'ouest. */
const xDe = (u) => XMAX * (1 - 2 * u);
const uDe = (x, apres) => (apres ? (1 + x / XMAX) / 2 : (1 - x / XMAX) / 2);
const magnitude = (x) => (RU + R_LUNE - Math.hypot(x, T().b)) / (2 * R_LUNE);
function etape(x, u) {
  const dist = Math.hypot(x, T().b);
  if (dist >= RP + R_LUNE) return u < 0.5 ? "avant" : "apres";
  if (dist >= RU + R_LUNE) return "penombre";
  if (dist > RU - R_LUNE) return "partielle";
  return "totalite";
}
const ETAPES = {
  avant: ["Hors de l'ombre", "La pleine Lune brille normalement. Elle s'approche de la pénombre de la Terre, à sa droite."],
  penombre: ["Dans la pénombre", "Vue de la Lune, la Terre cache une partie du Soleil : la Lune perd un peu d'éclat, surtout du côté de l'ombre. À l'œil nu, c'est à peine perceptible."],
  partielle: ["Phase partielle", "Une partie de la Lune est dans l'ombre. Elle paraît très sombre à côté de la partie encore éclairée ; aux jumelles, on y devine une teinte rougeâtre. Le bord de l'ombre est un arc de cercle : l'ombre ronde de la Terre."],
  totalite: ["Totalité", "Toute la Lune est dans l'ombre. Elle ne reçoit plus que la lumière rougie par l'atmosphère de la Terre et prend une teinte cuivrée, plus claire du côté du bord de l'ombre."],
  apres: ["Éclipse terminée", "La Lune a quitté la pénombre : elle brille de nouveau normalement."],
};
const fmt2 = (v) => v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function fmtTemps(u) {
  const m = -xDe(u) * MIN_PAR_UNITE, a = Math.abs(m), sg = m < 0 ? "−" : "+";
  if (a < 0.5) return "Maximum";
  if (a >= 60) return `${sg} ${Math.floor(a / 60)} h ${String(Math.round(a % 60) % 60).padStart(2, "0")}`;
  return `${sg} ${Math.round(a)} min`;
}

let pilote = false; // vrai quand le script recale le curseur (onInput ne doit rien changer)
const S = createSchema({
  surtitre: "Support de formation · Mécanique céleste",
  titre: "Éclipse de Lune",
  sousTitre: "La Lune traverse l'ombre de la Terre · pleine lune",
  distanceMin: 2,
  distanceMax: 90,
  apercu: { titre: "Vu par l'observateur" },
  commandes: [
    { type: "raccourcis", id: "types", label: "Type d'éclipse", boutons: Object.entries(TYPES).map(([id, t]) => ({ id, label: t.nom, onClick: () => choisirType(id) })) },
    { type: "curseur", id: "deroule", label: "Déroulement", min: 0, max: 1000, pas: 1, valeur: sim.u * 1000,
      format: (v) => fmtTemps(v / 1000), onInput: (v) => { if (!pilote) { sim.u = v / 1000; sim.anim = null; } } },
    { type: "raccourcis", id: "etapes", label: "Aller à l'instant", boutons: [
      { id: "p1", label: "Entrée pénombre (P1)", onClick: () => allerA(uDe(C().p, false)) },
      { id: "u1", label: "Entrée ombre (U1)", onClick: () => allerA(uDe(C().u1, false)) },
      { id: "u2", label: "Totalité (U2)", onClick: () => allerA(uDe(C().u2, false)) },
      { id: "max", label: "Maximum", onClick: () => allerA(0.5) },
      { id: "u3", label: "Fin totalité (U3)", onClick: () => allerA(uDe(C().u2, true)) },
      { id: "u4", label: "Sortie ombre (U4)", onClick: () => allerA(uDe(C().u1, true)) },
      { id: "p4", label: "Sortie pénombre (P4)", onClick: () => allerA(uDe(C().p, true)) },
    ] },
    { type: "bascule", id: "temps", label: "Temps qui passe", actif: false },
    { type: "bascule", id: "rayons", label: "Rayons", actif: true },
    { type: "bascule", id: "rouge", label: "Lumière rougie", actif: true },
    { type: "bascule", id: "cones", label: "Cônes d'ombre", actif: true },
    { type: "bascule", id: "orbite", label: "Orbite", actif: true },
  ],
  vues: [
    { id: "iso", label: "3/4", pos: [4, 8, 16], cible: [2, 0, 0] },
    { id: "dessus", label: "Dessus", pos: [-4, 36, 0.01], cible: [-4, 0, 0] },
    { id: "cote", label: "De côté", pos: [3, 0.6, 22], cible: [3, 0.5, 0] },
    { id: "lune", label: "Lune de près", exacte: true, suivre: true,
      pos: () => lune.position.clone().add(new THREE.Vector3(-1.6, 2.6, 1.6)), cible: () => lune.position },
  ],
  intro: () => `
    <div class="eyebrow">Le principe</div>
    <p>Une éclipse de Lune se produit quand la Lune traverse l'ombre de la Terre, toujours à la pleine lune. Contrairement à l'éclipse de Soleil, tous ceux qui voient la Lune la voient en même temps : la moitié de la Terre. Elle dure plusieurs heures et s'observe sans aucune protection.</p>
    ${legende([
      { couleur: COULEURS.corail, texte: "Ombre : vue de là, la Terre cache tout le Soleil. Une Lune entièrement dedans donne une éclipse totale." },
      { couleur: 0x8b9ab0, texte: "Pénombre : la Terre ne cache qu'une partie du Soleil. La Lune s'y assombrit à peine." },
      { couleur: COULEURS.orange, texte: "Lumière rougie : l'atmosphère de la Terre courbe un peu de lumière vers l'intérieur de l'ombre. C'est elle qui donne sa couleur à la Lune éclipsée." },
    ])}
    <p>Choisissez le type d'éclipse, puis faites avancer le curseur « Déroulement » ou activez « Temps qui passe ». L'encart montre la Lune et l'ombre de la Terre telles que les voit l'observateur.</p>
    <div class="eyebrow">Les mots de l'éclipse</div>
    <dl class="glossaire">
      <dt>Éclipse pénombrale</dt>
      <dd>La Lune ne traverse que la pénombre. Elle s'assombrit si peu que beaucoup d'observateurs ne remarquent rien.</dd>
      <dt>Éclipse partielle</dt>
      <dd>Une partie seulement de la Lune entre dans l'ombre. Le bord de l'ombre est toujours un arc de cercle : dès l'Antiquité, Aristote y voyait une preuve que la Terre est ronde.</dd>
      <dt>Éclipse totale</dt>
      <dd>Toute la Lune est dans l'ombre. L'ombre est près de trois fois plus large que la Lune : la totalité peut durer jusqu'à 1 h 46 min.</dd>
      <dt>Pourquoi rouge ?</dt>
      <dd>En traversant l'atmosphère de la Terre, la lumière du Soleil est un peu déviée vers l'intérieur de l'ombre. Elle traverse beaucoup d'air, qui disperse son bleu, et devient rouge-orangé, comme au coucher du Soleil. La Lune éclipsée est éclairée par tous les levers et couchers de Soleil de la Terre.</dd>
      <dt>Échelle de Danjon</dt>
      <dd>Note la teinte de la Lune en totalité, de 0 (très sombre, presque invisible) à 4 (orange cuivré très lumineux). Elle dépend des nuages et des poussières volcaniques dans l'atmosphère.</dd>
      <dt>Liseré turquoise</dt>
      <dd>Au bord de l'ombre, on devine parfois une frange bleu-vert : de la lumière qui a traversé la haute atmosphère, filtrée par la couche d'ozone.</dd>
      <dt>Les contacts</dt>
      <dd>P1 et P4 : entrée et sortie de la pénombre, invisibles à l'œil. U1 et U4 : entrée et sortie de l'ombre. U2 et U3 : début et fin de la totalité.</dd>
      <dt>Magnitude</dt>
      <dd>La part du diamètre de la Lune plongée dans l'ombre : 0,5 quand la moitié du diamètre y est, plus de 1 quand l'éclipse est totale.</dd>
      <dt>Pourquoi pas chaque mois ?</dt>
      <dd>L'orbite de la Lune est inclinée de 5° sur celle de la Terre. Le plus souvent, la pleine lune passe au-dessus ou au-dessous de l'ombre. Il y a éclipse seulement quand la pleine lune a lieu près d'un nœud, l'un des deux points où l'orbite de la Lune croise celle de la Terre.</dd>
    </dl>
    <p class="spec">Schéma non proportionnel : la Lune est en réalité à 30 diamètres terrestres. Les tailles de l'ombre et de la pénombre par rapport à la Lune sont respectées.</p>`,
});

// ---------- Éclairage : une seule source, le Soleil, à gauche ----------
S.lumieres.principale.position.set(-1, 0, 0);
S.lumieres.principale.intensity = 3.2;
S.lumieres.contre.intensity = 0;
S.lumieres.ambiance.intensity = 0.25;
S.scene.environment = null;

// ---------- Soleil ----------
const soleil = S.part("soleil", "Soleil", {
  ancre: [X_SOLEIL, R_SOLEIL + 0.2, 0],
  texte: "Il éclaire la Terre et la Lune. Comme tout objet éclairé, la Terre projette derrière elle une ombre, à l'opposé du Soleil. Ici, il est dessiné beaucoup trop près et trop petit : ses rayons arrivent en réalité pratiquement parallèles.",
  chiffres: "Diamètre : 1 392 000 km · distance : 150 millions de km · 109 fois le diamètre de la Terre",
});
S.add(soleil, mesh(new THREE.SphereGeometry(R_SOLEIL, 48, 24), M.lumineux(0xffd98a), X_SOLEIL, 0, 0));
{
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: textureHalo(), color: COULEURS.ambre, transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
  halo.position.set(X_SOLEIL, 0, 0); halo.scale.setScalar(R_SOLEIL * 4.2);
  S.scene.add(halo);
}

// ---------- Terre ----------
const terre = new THREE.Group();
S.scene.add(terre);
const pTerre = S.part("terre", "Terre", {
  parent: terre, etiquette: false,
  texte: "Elle projette derrière elle, à l'opposé du Soleil, une ombre en forme de cône très allongé. Son atmosphère, mince couche d'air, dévie un peu de lumière vers l'intérieur de ce cône et la colore de rouge.",
  chiffres: "Diamètre : 12 742 km · atmosphère utile : quelques dizaines de km · 2 à 3 éclipses de Lune par an en moyenne, pénombrales comprises",
});
{
  const sphere = mesh(new THREE.SphereGeometry(R_TERRE, 64, 32), M.astre(textures.terre()));
  sphere.rotation.y = Math.PI - 5 * DEG;
  S.add(pTerre, sphere);
}
S.label("Terre", () => new THREE.Vector3(0, R_TERRE + 0.1, 0), { partId: "terre" });

// ---------- Observateur, côté nuit ----------
const obsG = new THREE.Group();
obsG.position.set(R_TERRE, 0, 0);
S.scene.add(obsG);
const obs = S.part("observateur", "Observateur", {
  parent: obsG, etiquette: false,
  texte: "Il est du côté de la nuit, d'où l'on voit la pleine lune. Tous ceux qui ont la Lune au-dessus de leur horizon voient l'éclipse au même moment, au même stade : c'est la Lune elle-même qui s'assombrit. Aucune protection n'est nécessaire.",
  chiffres: "Visible depuis toute la moitié nuit de la Terre · à l'œil nu, aux jumelles ou au télescope",
});
{ // petit bonhomme debout, la tête vers son zénith (+X local)
  const mat = M.lumineux(0xf6f9fd), k = 0.8;
  const piece = (geo, x, z, ry = 0) => { const m = mesh(axeX(geo), mat, x * k, 0, z * k); m.rotation.y = ry; m.scale.setScalar(k); S.add(obs, m); };
  for (const s of [-1, 1]) {
    piece(new THREE.CylinderGeometry(0.035, 0.035, 0.36, 8), 0.17, s * 0.06, s * 0.18);
    piece(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 8), 0.44, s * 0.11, s * 0.55);
  }
  piece(new THREE.CylinderGeometry(0.06, 0.05, 0.3, 10), 0.48, 0);
  S.add(obs, mesh(new THREE.SphereGeometry(0.1 * k, 16, 12), mat, 0.72 * k, 0, 0));
}
S.label("Observateur", () => new THREE.Vector3(R_TERRE + 0.75, 0, 0), { partId: "observateur" });

// ---------- Lune, avec l'ombre de la Terre à sa surface ----------
const lune = new THREE.Group();
S.scene.add(lune);
const pLune = S.part("lune", "Lune", {
  parent: lune, etiquette: false,
  texte: "L'éclipse a toujours lieu à la pleine lune, mais pas à chaque pleine lune : son orbite est inclinée de 5°, elle passe le plus souvent au-dessus ou au-dessous de l'ombre. Dans l'ombre, elle ne disparaît presque jamais : elle prend une teinte rouge cuivré.",
  chiffres: "Diamètre : 3 474 km · distance : 384 400 km · elle avance d'environ son diamètre par heure",
});
{
  const sphere = mesh(new THREE.SphereGeometry(R_LUNE, 48, 24), M.astre(textures.lune()));
  sphere.rotation.y = Math.PI; // face visible tournée vers la Terre
  S.add(pLune, sphere);
}
const ombreLune = new THREE.Mesh(new THREE.SphereGeometry(R_LUNE * 1.006, 64, 32), M.ombre({
  rayon: R_TERRE, penteOmbre: PENTE_O, pentePenombre: PENTE_P,
  couleur: 0x62200e, opacite: 0.9, opacitePenombre: 0.7, couleurBord: 0x3f8f96, largeurBord: 0.07,
}));
lune.add(ombreLune);
S.label("Lune", () => lune.position.clone().add(new THREE.Vector3(0, R_LUNE + 0.1, 0)), { partId: "lune" });

// ---------- Cônes d'ombre et de pénombre de la Terre ----------
const S_FIN = D + 2.5;
const cones = new THREE.Group();
S.scene.add(cones);
const pOmbre = S.part("ombre", "Ombre de la Terre", {
  parent: cones, etiquette: false,
  texte: "La région où la Terre cache tout le Soleil. C'est un cône très long qui se rétrécit lentement. À la distance de la Lune, il est encore près de trois fois plus large qu'elle : la Lune peut y rester plus d'une heure et demie.",
  chiffres: "Longueur : 1,4 million de km · diamètre à la distance de la Lune : environ 9 200 km, 2,7 fois la Lune",
});
const pPen = S.part("penombre", "Pénombre", {
  parent: cones, etiquette: false,
  texte: "La région où la Terre ne cache qu'une partie du Soleil. La Lune y perd un peu de lumière, surtout près du bord de l'ombre. À l'œil nu, l'assombrissement ne se remarque guère que dans la moitié la plus proche de l'ombre.",
  chiffres: "Diamètre à la distance de la Lune : environ 16 500 km, 4,8 fois la Lune",
});
pPen.group.add(troncCone(R_TERRE, R_TERRE + PENTE_P * S_FIN, 0, S_FIN, 0x8b9ab0, 0.06, 0.4));
pOmbre.group.add(troncCone(R_TERRE, R_TERRE - PENTE_O * S_FIN, 0, S_FIN, COULEURS.corail, 0.14, 0.75));
S.label("Ombre de la Terre", () => new THREE.Vector3(4.2, -0.6, 0), { partId: "ombre", visible: () => S.state.cones });
S.label("Pénombre", () => new THREE.Vector3(5.5, R_TERRE + PENTE_P * 5.5 + 0.05, 0), { partId: "penombre", visible: () => S.state.cones });

// ---------- Orbite de la Lune (inclinée : la Lune passe au-dessus du centre de l'ombre) ----------
const orbite = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineDashedMaterial({ color: 0x8b9ab0, dashSize: 0.3, gapSize: 0.25, transparent: true, opacity: 0.45, depthWrite: false }));
S.scene.add(orbite);
const surOrbite = (a) => { const b = T().b, ro = Math.hypot(D, b), i = Math.atan2(b, D);
  return new THREE.Vector3(ro * Math.cos(i) * Math.cos(a), ro * Math.sin(i) * Math.cos(a), -ro * Math.sin(a)); };
function construireOrbite() {
  const pts = [];
  for (let n = 0; n <= 160; n++) pts.push(surOrbite(n / 160 * 2 * Math.PI));
  orbite.geometry.dispose();
  orbite.geometry = new THREE.BufferGeometry().setFromPoints(pts);
  orbite.computeLineDistances();
}
S.label("Orbite de la Lune", () => surOrbite(-50 * DEG), { visible: () => S.state.orbite });

// ---------- Rayons du Soleil (plan horizontal) et lumière rougie par l'atmosphère ----------
const ZR = Array.from({ length: 23 }, (_, i) => -5.5 + i * 0.5);
const NP = 5;
const rayons = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(ZR.length * 6), 3)),
  new THREE.LineBasicMaterial({ color: COULEURS.etoile, transparent: true, opacity: 0.16, depthWrite: false }));
const grains = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(ZR.length * NP * 3), 3)),
  new THREE.PointsMaterial({ size: 0.4, map: textureHalo(), color: COULEURS.ambre, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
rayons.frustumCulled = grains.frustumCulled = false;
S.scene.add(rayons, grains);
S.label("Rayons du Soleil", () => new THREE.Vector3(X_RAYONS + 2.2, 0, -5.5), { lumiere: true, visible: () => S.state.rayons });
function finRayon(y, z) {
  let x = X_FIN;
  for (const [c, r] of [[terre.position, R_TERRE], [lune.position, R_LUNE]]) {
    const q = (y - c.y) ** 2 + (z - c.z) ** 2;
    if (q < r * r) x = Math.min(x, c.x - Math.sqrt(r * r - q));
  }
  return x;
}
// Rayons rasant la Terre : déviés par l'atmosphère (déviation exagérée pour être visible),
// ils convergent vers l'axe de l'ombre à peu près à la distance de la Lune.
const H_ATM = R_TERRE + 0.05;
const TRAJETS = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([cy, cz]) => {
  const p = (x, h) => new THREE.Vector3(x, cy * h, cz * h);
  return [p(-3, H_ATM), p(-0.2, H_ATM), p(0.25, H_ATM * 0.985), p(D + 2.2, -H_ATM * 0.985 * 2.2 / (D - 0.25))];
});
const longueur = (pts) => pts.slice(1).reduce((s, p, i) => s + p.distanceTo(pts[i]), 0);
const surTrajet = (pts, d, out) => {
  for (let i = 1; i < pts.length; i++) { const l = pts[i].distanceTo(pts[i - 1]); if (d <= l) return out.lerpVectors(pts[i - 1], pts[i], d / l); d -= l; }
  return out.copy(pts.at(-1));
};
const rouge = new THREE.Group();
S.scene.add(rouge);
for (const pts of TRAJETS) rouge.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
  new THREE.LineBasicMaterial({ color: COULEURS.orange, transparent: true, opacity: 0.55, depthWrite: false })));
const NR = 9;
const grainsRouges = new THREE.Points(new THREE.BufferGeometry().setAttribute("position", new THREE.BufferAttribute(new Float32Array(TRAJETS.length * NR * 3), 3)),
  new THREE.PointsMaterial({ size: 0.42, map: textureHalo(), color: COULEURS.corail, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
grainsRouges.frustumCulled = false;
rouge.add(grainsRouges);
const pRouge = S.part("rouge", "Lumière rougie", {
  etiquette: false,
  texte: "L'atmosphère de la Terre agit comme une lentille : elle courbe la lumière qui la frôle vers l'intérieur de l'ombre. Cette lumière traverse beaucoup d'air, qui disperse le bleu (c'est pour cela que le ciel est bleu) : il ne reste que le rouge-orangé, comme au coucher du Soleil. La déviation, d'environ 1°, est exagérée ici.",
  chiffres: "Déviation : environ 1,2° pour un rayon rasant · ces rayons convergent vers 300 000 km, presque à la distance de la Lune",
});
S.label("Lumière rougie", () => new THREE.Vector3(2.6, H_ATM * 0.84, 0), { partId: "rouge", visible: () => S.state.rouge });

// ---------- Encart : la Lune et l'ombre de la Terre vues par l'observateur ----------
const ap = S.apercu;
const FACE = textures.faceLune(), NF = FACE.width;
const PX = FACE.getContext("2d").getImageData(0, 0, NF, NF).data;
const borne = (v) => Math.min(1, Math.max(0, v));
/** Facteurs de lumière [r, g, b] reçue en un point à la distance rho du centre de l'ombre. expo : réglage d'exposition de l'ombre. */
function lumiere(rho, expo) {
  if (rho >= RP) return [1, 1, 1];
  if (rho >= RU) { const l = 1 - 0.78 * Math.pow(1 - (rho - RU) / (RP - RU), 1.6); return [l, l, l]; }

  return c;
}
/** Dessine la Lune de rayon r (pixels) en (cx, cy), son centre étant en (mx, my) dans le repère de l'ombre (unités). Renvoie son éclat moyen. */
const tampon = document.createElement("canvas");
function dessinerLune(ctx, cx, cy, r, mx, my, dpr) {
  const n = Math.max(2, Math.round(2 * r * dpr));
  tampon.width = tampon.height = n;
  const tc = tampon.getContext("2d"), img = tc.createImageData(n, n), dist = Math.hypot(mx, my);
  const expo = 1 - 0.55 * borne((dist + R_LUNE - RU) / (2 * R_LUNE) * 3); // l'œil s'adapte quand toute la Lune est dans l'ombre
  let somme = 0, nb = 0;
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = (i + 0.5) / n * 2 - 1, y = 1 - (j + 0.5) / n * 2;
    if (x * x + y * y > 1) continue;
    const s = (Math.min(NF - 1, Math.floor((i + 0.5) / n * NF)) + Math.min(NF - 1, Math.floor((j + 0.5) / n * NF)) * NF) * 4;
    const l = lumiere(Math.hypot(mx + x * R_LUNE, my + y * R_LUNE), expo), k = (j * n + i) * 4;
    img.data[k] = Math.min(255, PX[s] * l[0] * 1.08); img.data[k + 1] = Math.min(255, PX[s + 1] * l[1] * 1.05); img.data[k + 2] = PX[s + 2] * l[2];
    img.data[k + 3] = PX[s + 3];

const ETOILES = (() => { const r = alea(3); return Array.from({ length: 45 }, () => [r(), r(), 0.4 + r() * 1.1]); })();
let clePrec = "", legendePrec = "";
function dessinerApercu(x) {
  const cv = ap.canvas, dpr = Math.min(devicePixelRatio, 2), W = cv.clientWidth;
  if (!W) return;
  const b = T().b, cle = [W, dpr, x.toFixed(4), b].join();
  if (cle === clePrec) return;
  clePrec = cle;
  const sc = (W / 2 - 4) / XMAX, Hs = Math.round(2 * Math.max(RP, 2.4) * sc + 8), rz = Math.round(W * 0.2), H = Hs + 2 * rz + 30;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = "#050913"; ctx.fillRect(0, 0, W, H);
  const cx = W / 2, cy = Hs / 2, mx = cx + x * sc, my = cy - b * sc;
  // l'ombre et la pénombre de la Terre, et le trajet de la Lune
  ctx.fillStyle = "rgba(139,154,176,0.10)"; ctx.beginPath(); ctx.arc(cx, cy, RP * sc, 0, 2 * Math.PI); ctx.fill();
  ctx.fillStyle = "rgba(255,107,94,0.10)"; ctx.beginPath(); ctx.arc(cx, cy, RU * sc, 0, 2 * Math.PI); ctx.fill();
  ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
  ctx.strokeStyle = "rgba(139,154,176,0.55)"; ctx.beginPath(); ctx.arc(cx, cy, RP * sc, 0, 2 * Math.PI); ctx.stroke();
  ctx.strokeStyle = css(COULEURS.corail); ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(cx, cy, RU * sc, 0, 2 * Math.PI); ctx.stroke(); ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(255,255,255,0.22)"; ctx.beginPath(); ctx.moveTo(4, my); ctx.lineTo(W - 4, my); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.beginPath(); ctx.moveTo(8, my); ctx.lineTo(14, my - 3.5); ctx.lineTo(14, my + 3.5); ctx.fill(); // sens du trajet
  ctx.font = "9px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#8b9ab0"; ctx.fillText("Pénombre", cx, cy + RP * sc - 5);
  ctx.fillStyle = css(COULEURS.corail); ctx.fillText("Ombre", cx, cy + RU * sc - 5);
  const eclat = dessinerLune(ctx, mx, my, R_LUNE * sc, x, b, dpr);
  // gros plan
  const yz = Hs + 15 + rz;
  ctx.fillStyle = "#03050a"; ctx.fillRect(0, Hs, W, H - Hs);
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.beginPath(); ctx.moveTo(0, Hs + 0.5); ctx.lineTo(W, Hs + 0.5); ctx.stroke();
  ctx.fillStyle = `rgba(220,228,240,${0.15 + 0.75 * (1 - eclat)})`;
  for (const [a, c, s] of ETOILES) { const px = a * W, py = Hs + 4 + c * (H - Hs - 8); if (Math.hypot(px - cx, py - yz) > rz + 6) ctx.fillRect(px, py, s, s); }

  ctx.textAlign = "left"; ctx.font = "bold 9px Arial"; ctx.fillStyle = css(COULEURS.accent);
  ctx.fillText("GROS PLAN", 6, Hs + 14);
  ctx.font = "9.5px Arial"; ctx.fillStyle = "#8b9ab0"; ctx.textBaseline = "bottom";
  ctx.fillText("Est", 5, H - 4); ctx.textAlign = "right"; ctx.fillText("Ouest", W - 5, H - 4);
  // légende
  const [nom, desc] = ETAPES[etape(x, sim.u)], m = magnitude(x);
  const html = `<h2>${nom}</h2><p class="spec">${fmtTemps(sim.u)} · ${m > 0 ? "magnitude " + fmt2(m) : "hors de l'ombre"}</p><p>${desc}</p>`;
  if (html !== legendePrec) { ap.legende.innerHTML = html; legendePrec = html; }
}

// ---------- Commandes ----------
function choisirType(id) {
  sim.type = id;
  construireOrbite();
  for (const t in TYPES) document.getElementById("r-" + t).setAttribute("aria-pressed", String(t === id));
  const c = C();
  for (const e of ["u1", "u4"]) document.getElementById("r-" + e).hidden = c.u1 === null;
  for (const e of ["u2", "u3"]) document.getElementById("r-" + e).hidden = c.u2 === null;
}
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function allerA(u) { sim.anim = { u0: sim.u, du: u - sim.u, t: 0 }; sim.pause = 0; }
const affiche = {};
function recaler(id, v) {
  const r = Math.round(v);
  if (affiche[id] === r) return;
  affiche[id] = r; pilote = true; S.regler(id, v); pilote = false;
}

// ---------- Animation ----------
let tPrec = 0;
const _p = new THREE.Vector3();
S.onFrame(({ dt, time }) => {
  const dtt = time - tPrec; tPrec = time;
  if (sim.anim) {
    sim.anim.t = S.reduced ? 1 : Math.min(1, sim.anim.t + dt / 1.2);
    sim.u = sim.anim.u0 + sim.anim.du * ease(sim.anim.t);
    if (sim.anim.t >= 1) sim.anim = null;
  } else if (S.state.temps) {
    if (sim.u < 1) sim.u = Math.min(1, sim.u + dtt / DUREE);
    else if ((sim.pause += dtt) > 1.5) { sim.u = 0; sim.pause = 0; }
  }
  recaler("deroule", sim.u * 1000);

  const x = xDe(sim.u);
  lune.position.set(D, T().b, x); // vu de la Terre côté nuit, la droite (ouest) est vers +Z
  cones.visible = S.state.cones;
  orbite.visible = S.state.orbite;

  // rayons et grains de lumière, arrêtés par la Terre et la Lune
  rayons.visible = grains.visible = S.state.rayons;
  if (S.state.rayons) {
    const pr = rayons.geometry.attributes.position, pg = grains.geometry.attributes.position, long = X_FIN - X_RAYONS;
    ZR.forEach((z, i) => {
      const fin = finRayon(0, z);
      pr.setXYZ(2 * i, X_RAYONS, 0, z); pr.setXYZ(2 * i + 1, fin, 0, z);
      for (let k = 0; k < NP; k++) {

        pg.setXYZ(i * NP + k, xg, xg < fin ? 0 : -1000, z);

        // n'éclaire qu'à partir du bord de la Terre (avant, c'est encore de la lumière blanche)
