<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collimation d'un Newton</title>
<meta name="description" content="Schéma 3D interactif de la collimation d'un télescope de Newton 200/1000 : dérèglement des miroirs primaire et secondaire, effet sur l'image d'une étoile, réglage au Cheshire et au collimateur laser.">
<link rel="stylesheet" href="../commun/charte.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import { createSchema, THREE, COULEURS, materiaux as M, axeX, axeZ, mesh, textureHalo, legende } from "../commun/schema.js";

// ---------- Géométrie optique (1 unité = 100 mm) : le même 200/1000 que telescope-newton ----------
const F = 10;          // focale du primaire (1000 mm)
const RM = 1.0;        // rayon du primaire (200 mm de diamètre)
const RT = 1.25;       // rayon du tube
const XP = -4.6;       // sommet du primaire
const TUBE_BACK = -5.0, TUBE_FRONT = 4.6;
const D = RT + 1.05;   // distance axe -> plan focal
const XS = XP + F - D; // centre du secondaire
const FE = 0.4;        // focale oculaire (schématique)
const SEC_R = 0.29;    // demi petit axe du secondaire
const DECAL = 0.029;   // offset du secondaire : ≈ 2,9 mm vers le primaire et à l'opposé du porte-oculaire
const RD = 0.25;       // rayon intérieur du tube coulissant du porte-oculaire
const RC = 0.14;       // rayon intérieur d'un coulant 31,75 mm (Cheshire, laser)
const Y_BAS = D - 0.35;  // bas du coulant de l'outil : sortie et cible du laser, champ du Cheshire
const Y_OEIL = D + 0.55; // trou de visée du Cheshire
const R_OEIL = 0.01;     // trou de visée Ø 2 mm
const R_PAST = 0.1, R_TROU = 0.025;          // pastille centrale Ø 20 mm, trou Ø 5 mm
const X_ARA = XS + 0.55, R_MOYEU = 0.16, E_BRANCHE = 0.005; // araignée : branches de 1 mm
const EXA = 2;         // la 3D exagère les inclinaisons ×2 ; l'aperçu utilise les angles réels
const MN = Math.PI / 10800;                  // une minute d'angle, en radians
const TOL_COMA = 0.022 * 125 / 1000;         // f/5 : 0,022·N³ = 2,75 mm au foyer, sur F = 1000 mm (rad)
const ARCSEC = 0.1 * 206265;                 // décalage au foyer (unités) -> secondes d'arc
const tubeLen = TUBE_FRONT - TUBE_BACK, tubeMid = (TUBE_FRONT + TUBE_BACK) / 2;
const SEG = [COULEURS.etoile, COULEURS.ambre, COULEURS.orange, COULEURS.corail];

// ---------- Petits calculs vectoriels (tableaux [x, y, z]) ----------
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const add = (a, b, s = 1) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const refl = (d, n) => add(d, n, -2 * dot(d, n));
const V3 = (p) => new THREE.Vector3(p[0], p[1], p[2]);

// ---------- Optique déréglée ----------
// Inclinaisons en minutes d'angle : p1 / p2 pour le primaire, s1 / s2 pour le secondaire.
const VX = new THREE.Vector3(1, 0, 0), VY = new THREE.Vector3(0, 1, 0), VZ = new THREE.Vector3(0, 0, 1);
const N0 = new THREE.Vector3(-1, 1, 0).normalize();   // normale du secondaire réglé
const AX0 = new THREE.Vector3(1, 1, 0).normalize();   // grand axe de l'ellipse du secondaire
const AY0 = new THREE.Vector3().crossVectors(N0, AX0);
function optique(t, k = 1) {
  const qp = new THREE.Quaternion().setFromAxisAngle(VZ, t.p1 * MN * k).multiply(new THREE.Quaternion().setFromAxisAngle(VY, t.p2 * MN * k));
  const qs = new THREE.Quaternion().setFromAxisAngle(VZ, t.s1 * MN * k).multiply(new THREE.Quaternion().setFromAxisAngle(AX0, t.s2 * MN * k));
  const r = (v, q) => v.clone().applyQuaternion(q).toArray();
  return { qp, qs, V: [XP, 0, 0], a: r(VX, qp), e1: r(VY, qp), e2: r(VZ, qp), C: [XS - DECAL, -DECAL, 0], n: r(N0, qs), u: r(AX0, qs), v: r(AY0, qs) };
}
/** Intersection avec le paraboloïde du primaire (flèche r²/4F autour de son axe). */
function hitPrimary(O, o, d) {
  const w = sub(o, O.V), wu = dot(w, O.a), du = dot(d, O.a);
  const wp = add(w, O.a, -wu), dp = add(d, O.a, -du);
  const A = dot(dp, dp), B = 2 * dot(wp, dp) - 4 * F * du, C = dot(wp, wp) - 4 * F * wu;
  const disc = B * B - 4 * A * C;
  if (disc < 0) return null;
  const q = -0.5 * (B + (B >= 0 ? 1 : -1) * Math.sqrt(disc));
  let t = Infinity;
  for (const r of [q / A, C / q]) if (Number.isFinite(r) && r > 1e-6 && r < t) t = r;
  if (!Number.isFinite(t)) return null;
  const p = add(o, d, t), pv = sub(p, O.V), pu = dot(pv, O.a), pp = add(pv, O.a, -pu);
  return { p, n: nrm(add(O.a, pp, -1 / (2 * F))), r: Math.hypot(pp[0], pp[1], pp[2]), l1: dot(pp, O.e1), l2: dot(pp, O.e2) };
}
/** Intersection avec le plan du secondaire ; dedans : dans l'ellipse ; face : côté aluminé. */
function hitSecondary(O, o, d) {
  const dn = dot(d, O.n);
  if (Math.abs(dn) < 1e-9) return null;
  const t = dot(sub(O.C, o), O.n) / dn;
  if (t < 1e-6) return null;
  const p = add(o, d, t), q = sub(p, O.C), qu = dot(q, O.u) / (SEC_R * Math.SQRT2), qv = dot(q, O.v) / SEC_R;
  return { p, dedans: qu * qu + qv * qv <= 1, face: dn < 0 };
}
/** Le rayon est-il arrêté par le moyeu ou une branche de l'araignée ? */
function araignee(o, d) {
  if (Math.abs(d[0]) < 1e-9) return false;
  const t = (X_ARA - o[0]) / d[0];
  if (t < 0) return false;
  const y = o[1] + d[1] * t, z = o[2] + d[2] * t, r = Math.hypot(y, z);
  if (r > RT) return false;
  return r < R_MOYEU || Math.abs(y - z) * Math.SQRT1_2 < E_BRANCHE || Math.abs(y + z) * Math.SQRT1_2 < E_BRANCHE;
}
/** Remontée dans le porte-oculaire jusqu'à la hauteur yFin ; s'arrête sur la paroi si le rayon en sort. */
function montee(p, d, yFin) {
  if (d[1] <= 1e-6) return { p: add(p, d, 1.5), ok: false };
  const at = (y) => add(p, d, (y - p[1]) / d[1]);
  const pT = at(RT), pF = at(yFin);
  const ax = pT[0] - XS, az = pT[2];
  if (Math.hypot(ax, az) > RD) return { p: pT, ok: false };          // arrêté par la base du porte-oculaire
  if (Math.hypot(pF[0] - XS, pF[2]) <= RD) return { p: pF, ok: true };
  const bx = pF[0] - pT[0], bz = pF[2] - pT[2];
  const A = bx * bx + bz * bz, B = 2 * (ax * bx + az * bz), C = ax * ax + az * az - RD * RD;
  const s = (-B + Math.sqrt(B * B - 4 * A * C)) / (2 * A);
  return { p: add(pT, sub(pF, pT), s), ok: false };                    // arrêté par la paroi du tube coulissant
}
/** Faisceau du collimateur laser, envoyé le long de l'axe du porte-oculaire. */
function traceLaser(O) {
  const o = [XS, Y_BAS, 0], d = [0, -1, 0], pts = [o], res = { pts };
  const h1 = hitSecondary(O, o, d);
  if (!h1 || !h1.dedans || !h1.face) { pts.push([XS, -RT, 0]); return res; }
  pts.push(h1.p);
  const d1 = refl(d, O.n), hp = hitPrimary(O, h1.p, d1);
  if (!hp) { pts.push(add(h1.p, d1, 3)); return res; }
  pts.push(hp.p);
  res.prim = [hp.l1, hp.l2];
  if (hp.r > RM) return res;
  const d2 = refl(d1, hp.n), h2 = hitSecondary(O, hp.p, d2);
  if (!h2 || !h2.dedans || !h2.face) { pts.push(add(hp.p, d2, (TUBE_FRONT + 0.3 - hp.p[0]) / d2[0])); return res; }
  pts.push(h2.p);
  const m = montee(h2.p, refl(d2, O.n), Y_BAS);
  pts.push(m.p);
  if (m.ok) res.retour = [m.p[0] - XS, m.p[2]];
  return res;
}

// ---------- Charte ----------
let outil = "oculaire";
const off = { p1: 0, p2: 0, s1: 0, s2: 0 };   // dérèglement caché de l'exercice
let exercice = false, reussi = false, pliage = false, sale = true;
const CLES = ["p1", "p2", "s1", "s2"];
const fmtAngle = (v) => exercice ? "?" : `${v > 0 ? "+" : v < 0 ? "−" : ""}${Math.abs(v)}′`;
const changer = () => { if (!pliage) reussi = false; sale = true; };
let tubeOuter, tubeInner, lip;
function setCut(on) {
  const mk = (r) => axeX(on ? new THREE.CylinderGeometry(r, r, tubeLen, 72, 1, true, Math.PI / 2, Math.PI)
                            : new THREE.CylinderGeometry(r, r, tubeLen, 72, 1, true));
  tubeOuter.geometry.dispose(); tubeOuter.geometry = mk(RT);
  tubeInner.geometry.dispose(); tubeInner.geometry = mk(RT - 0.015);
  lip.visible = !on;
  // en coupe, le porte-oculaire et l'outil deviennent translucides pour voir la lumière y entrer
  for (const p of [focuser, eyepiece, cheshire, laserPart]) for (const m of p.materials) {
    m.userData.opacite ??= m.opacity;
    m.transparent = on || m.userData.opacite < 1;
    m.opacity = on ? Math.min(m.userData.opacite, 0.3) : m.userData.opacite;
    m.depthWrite = !on && m.userData.opacite >= 1;
    m.needsUpdate = true;
  }
}

const S = createSchema({
  surtitre: "Support de formation · Instruments",
  titre: "Collimation d'un Newton",
  sousTitre: "Exemple : Newton 200/1000 · f/5",
  commandes: [
    { type: "curseur", id: "p1", label: "Primaire ↕", min: -30, max: 30, pas: 1, valeur: 0, format: fmtAngle, onInput: changer },
    { type: "curseur", id: "p2", label: "Primaire ↔", min: -30, max: 30, pas: 1, valeur: 0, format: fmtAngle, onInput: changer },
    { type: "curseur", id: "s1", label: "Secondaire ↕", min: -30, max: 30, pas: 1, valeur: 0, format: fmtAngle, onInput: changer },
    { type: "curseur", id: "s2", label: "Secondaire ↔", min: -30, max: 30, pas: 1, valeur: 0, format: fmtAngle, onInput: changer },
    { type: "raccourcis", id: "outil", label: "Outil", boutons: [
      { id: "oculaire", label: "Oculaire", onClick: () => choisirOutil("oculaire") },
      { id: "cheshire", label: "Cheshire", onClick: () => choisirOutil("cheshire") },
      { id: "laser", label: "Laser", onClick: () => choisirOutil("laser") },
    ] },
    { type: "raccourcis", id: "reglage", label: "Réglage", boutons: [
      { id: "collimate", label: "Collimaté", onClick: () => regler(0, 0, 0, 0) },
      { id: "derPrim", label: "Primaire déréglé", onClick: () => regler(18, -12, 0, 0) },
      { id: "derSec", label: "Secondaire déréglé", onClick: () => regler(0, 0, -14, 10) },
      { id: "exercice", label: "Exercice", onClick: lancerExercice },
    ] },
    { type: "bascule", id: "axes", label: "Axes optiques", actif: true },
    { type: "bascule", id: "coupe", label: "Tube en coupe", actif: true, onChange: setCut },
  ],
  vues: [
    { id: "iso", label: "3/4", pos: [12, 8.5, 20], cible: [0, 0.4, 0] },
    { id: "profil", label: "Profil", pos: [0.3, 1.0, 25], cible: [0, 0.4, 0] },
    { id: "secondaire", label: "Secondaire", pos: [XS + 4.5, 3.4, 10], cible: [XS - 0.8, 1.1, 0] },
    { id: "barillet", label: "Barillet", pos: [TUBE_BACK - 6, 2.5, 5], cible: [TUBE_BACK + 0.6, 0, 0] },
  ],
  apercu: { titre: "Vu à l'oculaire" },
  intro: () => `
    <div class="eyebrow">Aligner les deux miroirs</div>
    <p>Collimater, c'est faire passer l'axe optique du primaire par le centre du porte-oculaire. Choisissez un outil, déréglez un miroir et observez.</p>
    ${legende([
      { couleur: SEG[0], texte: "Secondaire d'abord : on l'incline jusqu'à ce que l'axe du porte-oculaire tombe au centre du primaire (point laser dans la pastille)." },
      { couleur: SEG[1], texte: "Primaire ensuite : les vis du barillet l'inclinent jusqu'à ce que son axe remonte dans le porte-oculaire (retour du laser dans le trou)." },
      { couleur: SEG[2], texte: "Contrôle au Cheshire : secondaire, reflet du primaire, pastille et reflet de l'œilleton sont concentriques." },
      { couleur: SEG[3], texte: "Contrôle final sur une étoile, à fort grossissement : défocalisée, elle montre des anneaux concentriques." },
    ])}
    <p class="spec">Dans la 3D, les inclinaisons sont exagérées ×2 pour être visibles ; l'aperçu montre l'effet réel. « Exercice » dérègle les miroirs au hasard et masque les valeurs.</p>`,
});

// ---------- Tube ----------
const tube = S.part("tube", "Tube optique", {
  ancre: [-1.0, RT + 0.05, 0],
  texte: "Il tient les deux miroirs face à face. Un choc, le transport ou un écart de température suffisent à décaler l'un d'eux : on vérifie la collimation avant chaque soirée.",
  chiffres: "Newton 200/1000 · f/5 : plus le rapport F/D est petit, plus la collimation est exigeante",
});
tubeOuter = S.add(tube, mesh(axeX(new THREE.CylinderGeometry(RT, RT, tubeLen, 72, 1, true)), M.peinture(), tubeMid));
tubeInner = S.add(tube, mesh(axeX(new THREE.CylinderGeometry(RT - 0.015, RT - 0.015, tubeLen, 72, 1, true)), M.flocage(), tubeMid));
lip = S.add(tube, mesh(axeX(new THREE.TorusGeometry(RT, 0.035, 10, 72).rotateX(Math.PI / 2)), M.noir(), TUBE_FRONT));

// ---------- Primaire (inclinable, pivote autour de son sommet) ----------
const primGroup = new THREE.Group();
primGroup.position.set(XP, 0, 0);
S.scene.add(primGroup);
const primary = S.part("primary", "Miroir primaire", {
  parent: primGroup, ancre: [-0.1, RM + 0.1, 0],
  texte: "Miroir parabolique : il ne donne une image parfaite que pour la lumière qui arrive le long de son axe optique. Si cet axe ne passe pas par le centre du porte-oculaire, l'étoile au centre du champ est vue « de biais » et prend une forme de comète : c'est la coma. Refaire la mise au point n'y change rien.",
  chiffres: "Tolérance à f/5 : axe à moins de ≈ 2,7 mm du centre du champ (≈ 9′ d'inclinaison) · à f/8 : ≈ 11 mm",
});
{
  const pts = [], T = 0.2;
  for (let i = 0; i <= 24; i++) { const r = (i / 24) * RM; pts.push(new THREE.Vector2(r, r * r / (4 * F))); }
  pts.push(new THREE.Vector2(RM, -T), new THREE.Vector2(0.001, -T));
  const g = new THREE.LatheGeometry(pts, 96);
  g.rotateZ(-Math.PI / 2);
  S.add(primary, mesh(g, M.miroir())).material.side = THREE.DoubleSide;
  S.add(primary, mesh(axeX(new THREE.CylinderGeometry(RM - 0.002, RM - 0.002, T - 0.01, 96, 1, true)), M.verre(), -T / 2));
  S.add(primary, mesh(axeX(new THREE.CylinderGeometry(RM + 0.06, RM + 0.06, 0.08, 72)), M.alu(), -0.26)); // plateau mobile du barillet
  for (let k = 0; k < 3; k++) {
    const a = k * (2 * Math.PI / 3) + Math.PI / 2 + 1;
    const clip = S.add(primary, mesh(new THREE.BoxGeometry(0.28, 0.06, 0.16), M.noir()));
    clip.position.set(0.03, Math.sin(a) * (RM - 0.04), Math.cos(a) * (RM - 0.04));
    clip.rotation.x = Math.PI / 2 - a;
  }
}
const pastille = S.part("pastille", "Pastille centrale", {
  parent: primGroup, ancre: [0.1, 0.3, 0.3],
  texte: "Petit anneau autocollant collé exactement au centre du primaire. Il ne gêne pas l'observation, car ce centre est déjà dans l'ombre du secondaire. C'est la cible commune du Cheshire et du laser.",
  chiffres: "Anneau Ø ≈ 20 mm · trou central Ø ≈ 5 mm",
});
S.add(pastille, mesh(new THREE.RingGeometry(R_TROU, R_PAST, 48).rotateY(Math.PI / 2), M.peinture(), 0.004));

// ---------- Barillet (fixe) : vis de réglage et de blocage ----------
const cell = S.part("cell", "Barillet", {
  ancre: [TUBE_BACK - 0.1, -RT - 0.05, 0],
  texte: "Support arrière du primaire. Trois vis de réglage à 120° inclinent le miroir, trois vis de blocage le maintiennent ensuite. On desserre les blocages, on règle par petites touches, puis on resserre sans forcer.",
  chiffres: "3 vis de réglage + 3 vis de blocage · quelques degrés de rotation de vis suffisent",
});
{
  S.add(cell, mesh(axeX(new THREE.CylinderGeometry(RT + 0.04, RT + 0.04, 0.12, 72)), M.noir(), TUBE_BACK - 0.06));
  for (let k = 0; k < 3; k++) {
    const a = k * (2 * Math.PI / 3) + Math.PI / 2, b = a + Math.PI / 3;
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.07, 0.07, 0.55, 16)), M.alu(), TUBE_BACK - 0.22, Math.sin(a) * 0.75, Math.cos(a) * 0.75));
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.14, 0.14, 0.12, 20)), M.noir(), TUBE_BACK - 0.5, Math.sin(a) * 0.75, Math.cos(a) * 0.75));
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 12)), M.alu(), TUBE_BACK - 0.2, Math.sin(b) * 0.75, Math.cos(b) * 0.75));
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.07, 0.07, 0.08, 6)), M.alu(), TUBE_BACK - 0.36, Math.sin(b) * 0.75, Math.cos(b) * 0.75));
  }
}

// ---------- Secondaire (inclinable autour de son centre) ----------
const secGroup = new THREE.Group();
secGroup.position.set(XS - DECAL, -DECAL, 0);
S.scene.add(secGroup);
const secondary = S.part("secondary", "Miroir secondaire", {
  parent: secGroup, ancre: [0, SEC_R + 0.15, 0],
  texte: "Miroir plan à 45°, tenu par l'araignée. Une vis centrale règle sa position, trois vis autour l'inclinent. Son inclinaison décide de l'endroit où l'axe du porte-oculaire tombe sur le primaire : on le règle toujours en premier.",
  chiffres: "Petit axe ≈ 58 mm · décalé de ≈ 3 mm vers le primaire (offset) · 1 vis centrale + 3 vis d'inclinaison",
});
{
  const g = new THREE.CylinderGeometry(SEC_R, SEC_R, 0.06, 64);
  g.rotateX(Math.PI / 2);
  g.scale(Math.SQRT2, 1, 1);
  const m = S.add(secondary, mesh(g, M.miroir()));
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(AX0, AY0, N0));
  S.add(secondary, mesh(axeX(new THREE.CylinderGeometry(0.11, 0.11, 0.5, 24)), M.noir(), 0.33 + DECAL));
}

// ---------- Araignée (fixe) ----------
const spider = S.part("spider", "Araignée", {
  ancre: [XS + 0.55, -0.9, 0.9],
  texte: "Elle tient le secondaire au centre du tube. Ses vis de réglage sont sur le moyeu, côté entrée du tube. Ses branches doivent rester bien tendues : une araignée qui bouge dérègle le secondaire.",
  chiffres: "4 branches d'environ 1 mm · 3 vis d'inclinaison autour d'une vis centrale",
});
{
  S.add(spider, mesh(axeX(new THREE.CylinderGeometry(R_MOYEU, R_MOYEU, 0.2, 24)), M.noir(), X_ARA));
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2, len = RT - R_MOYEU;
    const v = S.add(spider, mesh(new THREE.BoxGeometry(0.14, len, 0.01), M.noir(), X_ARA));
    v.rotation.x = Math.PI / 2 - a;
    v.position.y = Math.sin(a) * (R_MOYEU + len / 2);
    v.position.z = Math.cos(a) * (R_MOYEU + len / 2);
  }
  S.add(spider, mesh(axeX(new THREE.CylinderGeometry(0.035, 0.035, 0.14, 12)), M.alu(), X_ARA + 0.15));
  for (let k = 0; k < 3; k++) {
    const a = k * (2 * Math.PI / 3) + Math.PI / 2;
    S.add(spider, mesh(axeX(new THREE.CylinderGeometry(0.022, 0.022, 0.1, 10)), M.alu(), X_ARA + 0.13, Math.sin(a) * 0.1, Math.cos(a) * 0.1));
  }
}

// ---------- Porte-oculaire ----------
const focuser = S.part("focuser", "Porte-oculaire", {
  ancre: [XS + 0.7, RT + 0.35, 0],
  texte: "Son axe est la référence de toute la collimation : chaque outil s'y emboîte exactement, et les deux miroirs s'alignent sur lui. On collimate avec le porte-oculaire à peu près dans sa position d'observation.",
  chiffres: "Coulant 31,75 mm ou 50,8 mm · type crémaillère ou Crayford",
});
{
  S.add(focuser, mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.12, 40), M.noir(), XS, RT + 0.02, 0));

function faisceauEtoile(O, s, n, obstruction) {
  const res = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const y = ((i + 0.5) / n * 2 - 1) * RM, z = ((j + 0.5) / n * 2 - 1) * RM;
    if (y * y + z * z > RM * RM) continue;
    const o = add([XP, y, z], s, -12);
    if (obstruction) {
      if (araignee(o, s)) continue;
      const hs = hitSecondary(O, o, s);
      if (hs && hs.dedans) continue;
    }
    const hp = hitPrimary(O, o, s);
    if (!hp || hp.r > RM) continue;
    const d1 = refl(s, hp.n), h2 = hitSecondary(O, hp.p, d1);
    if (!h2 || !h2.dedans || !h2.face) continue;

  for (let k = 0; k < NI * NI; k++) {
    const v = Math.min(1, Math.pow(vals[k] / ref, gamma));
    img.data[k * 4] = 255 * v; img.data[k * 4 + 1] = 244 * v; img.data[k * 4 + 2] = 214 * v; img.data[k * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}
const cvNet = Object.assign(document.createElement("canvas"), { width: NI, height: NI });
const cvFlou = Object.assign(document.createElement("canvas"), { width: NI, height: NI });

// ---------- Vue par l'œilleton du Cheshire (lancer de rayons depuis l'œil) ----------
const COUL = {
  tube: [6, 7, 9], feuille: [150, 152, 156], coulant: [44, 48, 55], fond: [17, 18, 21], ciel: [178, 188, 202], pastille: [240, 238, 228],
  clip: [18, 18, 20], plateau: [36, 38, 43], face: [228, 216, 188], oeil: [0, 0, 0], araignee: [12, 12, 14],
};
const CLIPS = [0, 1, 2].map((k) => k * (2 * Math.PI / 3) + Math.PI / 2 + 1);
const estClip = (hp) => hp.r > RM - 0.07 && CLIPS.some((a) => {
  let da = Math.atan2(hp.l1, hp.l2) - a;
  da = Math.atan2(Math.sin(da), Math.cos(da));
  return Math.abs(da) < 0.08;
});
const TAN_CH = 0.125;      // demi-champ affiché (le coulant limite à ≈ 0,155)
function pixelCheshire(O, d) {
  const E = [XS, Y_OEIL, 0];
  const pb = add(E, d, (Y_BAS - E[1]) / d[1]);
  if (Math.hypot(pb[0] - XS, pb[2]) > RC) return COUL.coulant;
  const h1 = hitSecondary(O, pb, d);
  if (!h1 || !h1.dedans || !h1.face) return COUL.feuille; // feuille blanche glissée face au porte-oculaire
  const d1 = refl(d, O.n), hp = hitPrimary(O, h1.p, d1);
  if (!hp || hp.r > RM + 0.06) return COUL.tube;
  let c, k = 0.9;
  if (hp.r > RM) c = COUL.plateau;
  else if (hp.r > R_TROU && hp.r < R_PAST) c = COUL.pastille;
  else if (estClip(hp)) c = COUL.clip;
  else {
    k *= 0.9;
    const d2 = refl(d1, hp.n), h2 = hitSecondary(O, hp.p, d2);
    if (h2 && h2.dedans && h2.face) {
      k *= 0.9;
      const d3 = refl(d2, O.n);
      if (d3[1] <= 0) c = COUL.tube;
      else {
        const pB = add(h2.p, d3, (Y_BAS - h2.p[1]) / d3[1]);
        if (Math.hypot(pB[0] - XS, pB[2]) > RC) c = COUL.fond;
        else {
          const pO = add(h2.p, d3, (Y_OEIL - 0.04 - h2.p[1]) / d3[1]);
          c = Math.hypot(pO[0] - XS, pO[2]) < R_OEIL ? COUL.oeil : COUL.face;
        }
      }
    } else c = araignee(hp.p, d2) ? COUL.araignee : COUL.ciel;
  }
  return [c[0] * k, c[1] * k, c[2] * k];
}
const cvCh = document.createElement("canvas");
let cleCh = "";
function rendreCheshire(O, n, cle) {
  if (cle === cleCh) return;
  cleCh = cle;
  cvCh.width = cvCh.height = n;
  const ctx = cvCh.getContext("2d"), img = ctx.createImageData(n, n);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const fx = ((i + 0.5) / n * 2 - 1) * TAN_CH, fy = (1 - (j + 0.5) / n * 2) * TAN_CH, q = (j * n + i) * 4;
    if (fx * fx + fy * fy > TAN_CH * TAN_CH * 1.03) continue;
    const c = pixelCheshire(O, nrm([fy, -1, fx])); // droite = +z, haut = +x
    img.data[q] = c[0]; img.data[q + 1] = c[1]; img.data[q + 2] = c[2]; img.data[q + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

// ---------- Encart d'aperçu ----------
const ap = S.apercu;
const TITRES = { oculaire: "Vu à l'oculaire", cheshire: "Vu dans le Cheshire", laser: "Vu sur les cibles du laser" };
let diag = null, legendePrec = "";
const tilts = () => ({ p1: S.state.p1 + off.p1, p2: S.state.p2 + off.p2, s1: S.state.s1 + off.s1, s2: S.state.s2 + off.s2 });

function mettreAJour() {
  const t = tilts();
  const O = optique(t);
  mettreA3D(optique(t, EXA));
  const L = traceLaser(O);
  const erPrim = L.prim ? Math.hypot(...L.prim) * 100 : Infinity;   // mm
  const erRetour = L.retour ? Math.hypot(...L.retour) * 100 : Infinity;
  const secOk = erPrim <= 2.5, primOk = secOk && erRetour <= 4;
  diag = { O, L, erPrim, erRetour, secOk, primOk, cle: CLES.map((k) => t[k]).join(",") };
  if (outil === "oculaire") {
    const e = calculEtoile(O);
    diag.ecart = e.ecart;
    versImage(e.net, REF.net * 0.3, 0.45, cvNet);
    versImage(e.flou, REF.flou, 0.8, cvFlou);
  }
  if (exercice && secOk && primOk) {          // exercice réussi : on dévoile les valeurs
    const vals = CLES.map((k) => S.state[k] + off[k]);
    exercice = false; reussi = true; pliage = true;
    CLES.forEach((k, i) => { off[k] = 0; S.regler(k, vals[i]); });
    pliage = false;
    majBoutons();
  }
  majLegende();
}

function rond(ctx, img, x, s, lisse = true) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x + s / 2, s / 2, s / 2 - 1, 0, 2 * Math.PI); ctx.clip();
  ctx.fillStyle = "#000"; ctx.fillRect(x, 0, s, s);
  ctx.imageSmoothingEnabled = lisse;
  if (img) ctx.drawImage(img, x, 0, s, s);
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x + s / 2, s / 2, s / 2 - 1, 0, 2 * Math.PI); ctx.stroke();
}
function point(ctx, x, y, r) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 3);
  g.addColorStop(0, "rgba(255,235,230,1)"); g.addColorStop(0.25, "rgba(255,45,45,0.95)"); g.addColorStop(1, "rgba(255,45,45,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3, 0, 2 * Math.PI); ctx.fill();
}
/** Panneau rond centré sur une cible ; demi : demi-champ (unités) ; dessin(ctx, versPx) ; pos : position du point rouge. */
function panneauLaser(ctx, x, s, demi, fond, pos) {
  const cx = x + s / 2, cy = s / 2, k = (s / 2 - 1) / demi;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, s / 2 - 1, 0, 2 * Math.PI); ctx.clip();
  fond(ctx, cx, cy, k);
  if (pos) {
    const r = Math.hypot(pos[0], pos[1]), lim = demi * 0.92, f = r > lim ? lim / r : 1;
    point(ctx, cx + pos[0] * f * k, cy - pos[1] * f * k, Math.max(2.5, s * 0.022));
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, s / 2 - 1, 0, 2 * Math.PI); ctx.stroke();
}
const fondPrimaire = (ctx, cx, cy, k) => {
  const g = ctx.createRadialGradient(cx - 0.1 * k, cy - 0.1 * k, 0, cx, cy, 0.3 * k);
  g.addColorStop(0, "#59606b"); g.addColorStop(1, "#262a31");
  ctx.fillStyle = g; ctx.fillRect(cx - k, cy - k, 2 * k, 2 * k);
  ctx.fillStyle = "#efede4";
  ctx.beginPath(); ctx.arc(cx, cy, R_PAST * k, 0, 2 * Math.PI); ctx.arc(cx, cy, R_TROU * k, 0, 2 * Math.PI, true); ctx.fill();
};
const fondCible = (ctx, cx, cy, k) => {
  ctx.fillStyle = "#1c1f25"; ctx.fillRect(cx - k, cy - k, 2 * k, 2 * k);
  ctx.fillStyle = "#e9e4d6"; ctx.beginPath(); ctx.arc(cx, cy, 0.16 * k, 0, 2 * Math.PI); ctx.fill();
  ctx.strokeStyle = "rgba(20,24,30,0.55)"; ctx.lineWidth = 1;
  for (const r of [0.04, 0.08, 0.12]) { ctx.beginPath(); ctx.arc(cx, cy, r * k, 0, 2 * Math.PI); ctx.stroke(); }
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(cx, cy, 0.02 * k, 0, 2 * Math.PI); ctx.fill();
};

function dessinerApercu() {
  const cv = ap.canvas, dpr = Math.min(devicePixelRatio, 2), W = cv.clientWidth;
  if (!W || !diag) return;
  const gap = 10, lab = 20, deux = outil !== "cheshire";
  const s = deux ? Math.floor((W - gap) / 2) : W, H = s + lab;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.height = H + "px";
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const titres = [];
  if (outil === "oculaire") {
    rond(ctx, cvNet, 0, s); rond(ctx, cvFlou, s + gap, s);
    titres.push("Étoile au point", "Défocalisée");
  } else if (outil === "cheshire") {
    const n = Math.min(320, Math.round(s * dpr));
    rendreCheshire(diag.O, n, diag.cle + "|" + n);
    rond(ctx, cvCh, 0, s);
    titres.push("Par le trou de visée");
  } else {
    const L = diag.L;
    // pastille vue depuis l'entrée du tube : droite = −z, haut = +y ; cible vue d'en haut : droite = +z, haut = +x
    panneauLaser(ctx, 0, s, 0.25, fondPrimaire, L.prim ? [-L.prim[1], L.prim[0]] : null);
    panneauLaser(ctx, s + gap, s, 0.2, fondCible, L.retour ? [L.retour[1], L.retour[0]] : null);
    titres.push("Pastille du primaire", "Cible du laser");
  }
  ctx.font = "11.5px Arial"; ctx.textAlign = "center"; ctx.fillStyle = "#c4d0e0";
  titres.forEach((t, i) => ctx.fillText(t, (deux ? i * (s + gap) : 0) + s / 2, s + 14));
}

function majLegende() {
  const d = diag, mm = (v) => `${v.toFixed(v < 10 ? 1 : 0).replace(".", ",")} mm`;
  let h2, spec = "", p;
  if (reussi) {
    h2 = "Bravo, collimation réussie !";
    p = "Secondaire puis primaire : le point laser est dans la pastille, le retour dans le trou, et l'étoile est nette. Les valeurs sont maintenant affichées.";
  } else if (outil === "oculaire") {
    const am = d.ecart / MN;
    spec = exercice ? "Exercice : valeurs masquées" : `Écart d'axe ${Math.round(am)}′ · tolérance à f/5 ≈ 9′`;
    if (d.ecart <= TOL_COMA) {
      h2 = "Image nette";
      p = "Au point, l'étoile est un point entouré d'anneaux fins. Défocalisée, ses anneaux sont concentriques autour de l'ombre du secondaire.";
      if (!d.secOk) p += " Attention : le secondaire est déréglé et le primaire le compense. L'étoile paraît bonne, mais le faisceau est décentré et une partie de la lumière se perd.";
    } else {
      h2 = "Coma : l'étoile s'étale";
      p = "Au point, l'étoile devient une petite comète. Défocalisée, l'ombre du secondaire n'est plus au centre du disque. La mise au point n'y peut rien : planètes molles, étoiles doubles serrées non séparées.";
    }
  } else if (outil === "cheshire") {
    if (!d.secOk) {
      h2 = "Secondaire à régler";
      p = "La pastille et le reflet du primaire ne sont pas au centre du cercle du secondaire. On règle d'abord les 3 vis du secondaire.";
    } else if (!d.primOk) {
      h2 = "Primaire à régler";
      p = "Le secondaire est bon : la pastille est centrée. Mais le reflet sombre de l'œilleton est sorti de la pastille : on règle les vis du barillet, à l'arrière du tube.";
    } else {
      h2 = "Tout est concentrique";
      p = "Le reflet de l'œilleton tombe dans la pastille : la collimation est bonne. Il reste à vérifier sur une étoile.";
    }
  } else {
    spec = `Point sur le primaire : ${Number.isFinite(d.erPrim) ? mm(d.erPrim) : "hors du miroir"} · retour : ${Number.isFinite(d.erRetour) ? mm(d.erRetour) : "hors cible"}`;
    if (!d.secOk) {
      h2 = "Étape 1 : le secondaire";
      p = "Le point rouge tombe à côté du trou de la pastille. Tournez les vis du secondaire pour l'y ramener.";
    } else if (!d.primOk) {
      h2 = "Étape 2 : le primaire";
      p = Number.isFinite(d.erRetour) && d.erRetour < 16
        ? "Le point est dans la pastille. Le faisceau de retour arrive à côté du trou de sortie : tournez les vis du barillet pour le ramener au centre de la cible."
        : "Le point est dans la pastille, mais le faisceau de retour ne revient même pas sur la cible : le primaire est très déréglé. Tournez les vis du barillet.";
    } else {
      h2 = "Collimation réussie";
      p = "Point dans la pastille, retour dans le trou de sortie. Vérifiez sur une étoile.";
    }
  }
  if (exercice && outil !== "oculaire") spec = (spec ? spec + " · " : "") + "Exercice en cours";
  const html = `<h2>${h2}</h2>${spec ? `<p class="spec">${spec}</p>` : ""}<p>${p}</p>`;
  if (html !== legendePrec) { ap.legende.innerHTML = html; legendePrec = html; }
}

// ---------- Commandes ----------
function majBoutons() {
  for (const id of ["oculaire", "cheshire", "laser"]) document.getElementById("r-" + id).setAttribute("aria-pressed", String(outil === id));
  document.getElementById("r-exercice").setAttribute("aria-pressed", String(exercice));
  ap.el.querySelector(".eyebrow").textContent = TITRES[outil];
}
function choisirOutil(id) {
  outil = id;
  for (const [nom, p] of [["oculaire", eyepiece], ["cheshire", cheshire], ["laser", laserPart]]) p.group.visible = outil === nom;
  majBoutons();
  sale = true;
}
function regler(p1, p2, s1, s2) {
  exercice = false; reussi = false;
  for (const k of CLES) off[k] = 0;
  [p1, p2, s1, s2].forEach((v, i) => S.regler(CLES[i], v));
  majBoutons();
  sale = true;
}
function lancerExercice() {
  const hasard = () => (Math.random() < 0.5 ? -1 : 1) * Math.round(8 + Math.random() * 12);
  for (const k of CLES) off[k] = hasard();
  exercice = true; reussi = false;
  for (const k of CLES) S.regler(k, 0);
  majBoutons();
  sale = true;
}

// ---------- Animation ----------
let largeurPrec = 0;
S.onFrame(({ time }) => {
  const W = ap.canvas.clientWidth;
  if (sale) { sale = false; mettreAJour(); dessinerApercu(); largeurPrec = W; }
  else if (W !== largeurPrec) { dessinerApercu(); largeurPrec = W; }
  axes.visible = S.state.axes;
  lumEtoile.group.visible = outil === "oculaire";
  lumLaser.group.visible = outil === "laser";
  const anim = S.state.anim || S.reduced;
  lumEtoile.photons.visible = lumLaser.photons.visible = anim;
  if (anim) { lumEtoile.animer(time, 5); lumLaser.animer(time, 6); }
});

choisirOutil("oculaire");
S.start();
</script>
