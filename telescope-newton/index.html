<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Télescope de Newton</title>
<meta name="description" content="Schéma 3D interactif d'un télescope de Newton 200/1000 : vue éclatée et trajet de la lumière.">
<link rel="stylesheet" href="../commun/charte.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import { createSchema, THREE, COULEURS, materiaux as M, axeX, axeZ, mesh, textureHalo, legende } from "../commun/schema.js";

// ---------- Géométrie optique (1 unité = 100 mm) ----------
const F = 10;          // focale du primaire (1000 mm)
const RM = 1.0;        // rayon du primaire (200 mm de diamètre)
const RT = 1.25;       // rayon du tube
const XP = -4.6;       // sommet du primaire
const TUBE_BACK = -5.0, TUBE_FRONT = 4.6;
const D = RT + 1.05;   // distance axe -> plan focal
const XS = XP + F - D; // centre du secondaire
const FE = 0.4;        // focale oculaire (schématique)
const SEC_R = 0.29;    // demi petit axe du secondaire

const SEG = [COULEURS.etoile, COULEURS.ambre, COULEURS.orange, COULEURS.corail];
let ocular = 25;
let tubeOuter, tubeInner, lip;
const tubeLen = TUBE_FRONT - TUBE_BACK, tubeMid = (TUBE_FRONT + TUBE_BACK) / 2;

function setCut(on) {
  const mk = (r) => axeX(on ? new THREE.CylinderGeometry(r, r, tubeLen, 72, 1, true, Math.PI / 2, Math.PI)
                            : new THREE.CylinderGeometry(r, r, tubeLen, 72, 1, true));
  tubeOuter.geometry.dispose(); tubeOuter.geometry = mk(RT);
  tubeInner.geometry.dispose(); tubeInner.geometry = mk(RT - 0.015);
  lip.visible = !on;
}

const S = createSchema({
  surtitre: "Support de formation · Optique",
  titre: "Télescope de Newton",
  sousTitre: "Exemple : Newton 200/1000 · f/5",
  eclate: true,
  commandes: [
    { type: "bascule", id: "lumiere", label: "Trajet lumière", actif: true },
    { type: "bascule", id: "coupe", label: "Tube en coupe", actif: true, onChange: setCut },
  ],
  vues: [
    { id: "iso", label: "3/4", pos: [12, 8.5, 20], cible: [0, 0.2, 0] },
    { id: "profil", label: "Profil", pos: [0.3, 1.0, 25], cible: [0, 0.2, 0] },
    { id: "face", label: "Entrée du tube", pos: [17, 0.4, 0.6], cible: [0, 0, 0] },
    { id: "dessus", label: "Dessus", pos: [XS + 0.01, 16, 0.5], cible: [XS - 3, 0, 0] },
  ],
  intro: () => `
    <div class="eyebrow">Le trajet de la lumière</div>
    ${legende([
      { couleur: SEG[0], texte: "La lumière d'une étoile arrive en rayons parallèles et entre par l'ouverture du tube." },
      { couleur: SEG[1], texte: "Le miroir primaire, au fond, la réfléchit et la fait converger vers le foyer." },
      { couleur: SEG[2], texte: "Avant d'atteindre le foyer, le miroir secondaire à 45° renvoie le cône sur le côté." },
      { couleur: SEG[3], texte: "L'image se forme au foyer, puis l'oculaire la grossit et renvoie des rayons parallèles vers l'œil." },
    ])}
    <p class="spec">Le tube travaille « par le côté » : l'observateur se place près de l'entrée du tube, pas derrière comme avec une lunette.</p>`,
});

// ---------- Tube ----------
const tube = S.part("tube", "Tube optique", {
  ancre: [-1.0, RT + 0.05, 0],
  texte: "Il maintient les deux miroirs parfaitement alignés et protège le trajet de la lumière. L'intérieur est noir mat (floqué) pour absorber la lumière parasite qui dégraderait le contraste.",
  chiffres: "Longueur ≈ focale du primaire, soit ≈ 1 m pour un 200/1000",
});
tubeOuter = S.add(tube, mesh(axeX(new THREE.CylinderGeometry(RT, RT, tubeLen, 72, 1, true)), M.peinture(), tubeMid));
tubeInner = S.add(tube, mesh(axeX(new THREE.CylinderGeometry(RT - 0.015, RT - 0.015, tubeLen, 72, 1, true)), M.flocage(), tubeMid));
lip = S.add(tube, mesh(axeX(new THREE.TorusGeometry(RT, 0.035, 10, 72).rotateX(Math.PI / 2)), M.noir(), TUBE_FRONT));

// ---------- Miroir primaire (paraboloïde réel : flèche = r²/4F) ----------
const primary = S.part("primary", "Miroir primaire", {
  eclate: [-2.3, 0, 0], ancre: [XP - 0.1, RM + 0.1, 0],
  texte: "Miroir concave de forme parabolique, aluminé sur sa face avant. Il collecte la lumière et la fait converger en un point : le foyer. Une parabole renvoie tous les rayons parallèles exactement au même point, ce qu'un miroir sphérique ne fait pas (aberration de sphéricité). Son diamètre fixe la quantité de lumière captée et le pouvoir séparateur.",
  chiffres: "D = 200 mm · F = 1000 mm · rapport F/D = 5 · flèche au bord ≈ 0,25 mm",
});
{
  const pts = [], T = 0.2;
  for (let i = 0; i <= 24; i++) { const r = (i / 24) * RM; pts.push(new THREE.Vector2(r, r * r / (4 * F))); }
  pts.push(new THREE.Vector2(RM, -T), new THREE.Vector2(0.001, -T));
  const g = new THREE.LatheGeometry(pts, 96);
  g.rotateZ(-Math.PI / 2);
  const face = S.add(primary, mesh(g, M.miroir(), XP));
  face.material.side = THREE.DoubleSide;
  S.add(primary, mesh(axeX(new THREE.CylinderGeometry(RM - 0.002, RM - 0.002, T - 0.01, 96, 1, true)), M.verre(), XP - T / 2));
}

// ---------- Barillet ----------
const cell = S.part("cell", "Barillet", {
  eclate: [-3.9, 0, 0], ancre: [TUBE_BACK - 0.1, -RT - 0.05, 0],
  texte: "Support arrière du miroir primaire. Ses vis de collimation (tirantes et poussantes, montées sur ressorts) permettent d'incliner le miroir pour aligner parfaitement l'optique : c'est la collimation.",
  chiffres: "3 paires de vis à 120° · clips de maintien du miroir",
});
{
  S.add(cell, mesh(axeX(new THREE.CylinderGeometry(RT + 0.04, RT + 0.04, 0.12, 72)), M.noir(), TUBE_BACK - 0.06));
  S.add(cell, mesh(axeX(new THREE.CylinderGeometry(RM + 0.06, RM + 0.06, 0.08, 72)), M.alu(), XP - 0.26));
  for (let k = 0; k < 3; k++) {
    const a = k * (2 * Math.PI / 3) + Math.PI / 2;
    const y = Math.sin(a), z = Math.cos(a);
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.07, 0.07, 0.55, 16)), M.alu(), TUBE_BACK - 0.22, y * 0.75, z * 0.75));
    S.add(cell, mesh(axeX(new THREE.CylinderGeometry(0.14, 0.14, 0.12, 20)), M.noir(), TUBE_BACK - 0.5, y * 0.75, z * 0.75));
    const clip = S.add(cell, mesh(new THREE.BoxGeometry(0.28, 0.06, 0.16), M.noir()));
    clip.position.set(XP + 0.03, Math.sin(a + 1) * (RM - 0.04), Math.cos(a + 1) * (RM - 0.04));
    clip.rotation.x = Math.PI / 2 - (a + 1);
  }
}

// ---------- Miroir secondaire (plan elliptique à 45°) ----------
const secondary = S.part("secondary", "Miroir secondaire", {
  eclate: [2.3, 0, 0], ancre: [XS, SEC_R + 0.15, 0],
  texte: "Petit miroir plan, de forme elliptique, incliné à 45°. Il intercepte le cône de lumière avant le foyer et le renvoie à 90° sur le côté du tube, là où l'on place l'oculaire. Vu depuis le porte-oculaire, il paraît parfaitement rond. Il masque le centre du faisceau : c'est l'obstruction centrale.",
  chiffres: "Petit axe ≈ 58 mm · obstruction ≈ 29 % du diamètre",
});
{
  const g = new THREE.CylinderGeometry(SEC_R, SEC_R, 0.06, 64);
  g.rotateX(Math.PI / 2);
  g.scale(Math.SQRT2, 1, 1);
  const n = new THREE.Vector3(-1, 1, 0).normalize();
  const ax = new THREE.Vector3(1, 1, 0).normalize();
  const ay = new THREE.Vector3().crossVectors(n, ax);
  const m = S.add(secondary, mesh(g, M.miroir(), XS));
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(ax, ay, n));
  S.add(secondary, mesh(axeX(new THREE.CylinderGeometry(0.11, 0.11, 0.55, 24)), M.noir(), XS + 0.36));
}

// ---------- Araignée (branches à 45°) ----------
const spider = S.part("spider", "Araignée", {
  eclate: [3.6, 0, 0], ancre: [XS + 0.55, -0.9, 0.9],
  texte: "Fines branches qui tiennent le miroir secondaire au centre du tube. Trois vis permettent de régler son inclinaison. La diffraction sur ces branches produit les aigrettes en croix visibles autour des étoiles brillantes.",
  chiffres: "4 branches de ≈ 0,5 mm d'épaisseur",
});
{
  S.add(spider, mesh(axeX(new THREE.CylinderGeometry(0.16, 0.16, 0.2, 24)), M.noir(), XS + 0.55));
  for (let k = 0; k < 4; k++) {
    const a = Math.PI / 4 + k * Math.PI / 2;
    const len = RT - 0.16;
    const v = S.add(spider, mesh(new THREE.BoxGeometry(0.14, len, 0.02), M.noir(), XS + 0.55));
    v.rotation.x = Math.PI / 2 - a;
    v.position.y = Math.sin(a) * (0.16 + len / 2);
    v.position.z = Math.cos(a) * (0.16 + len / 2);
  }
}

// ---------- Porte-oculaire ----------
const focuser = S.part("focuser", "Porte-oculaire", {
  eclate: [0, 1.6, 0], ancre: [XS + 0.7, RT + 0.35, 0],
  texte: "Tube coulissant que l'on monte ou descend avec les molettes pour amener le foyer du télescope exactement sur l'oculaire : c'est la mise au point. Il est placé à hauteur du secondaire, sur le côté du tube.",
  chiffres: "Coulant 31,75 mm ou 50,8 mm · type crémaillère ou Crayford",
});
{
  S.add(focuser, mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.12, 40), M.noir(), XS, RT + 0.02, 0));
  S.add(focuser, mesh(new THREE.CylinderGeometry(0.33, 0.33, 0.55, 40), M.noir(), XS, RT + 0.33, 0));
  S.add(focuser, mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.4, 40, 1, true), M.alu(), XS, RT + 0.78, 0)).material.side = THREE.DoubleSide;
  S.add(focuser, mesh(axeZ(new THREE.CylinderGeometry(0.05, 0.05, 1.3, 12)), M.alu(), XS, RT + 0.3, 0));
  for (const s of [-1, 1]) S.add(focuser, mesh(axeZ(new THREE.CylinderGeometry(0.17, 0.17, 0.12, 24)), M.noir(), XS, RT + 0.3, s * 0.65));
}

// ---------- Oculaire (avec calcul du grossissement) ----------
const eyepiece = S.part("eyepiece", "Oculaire", {
  eclate: [0, 3.1, 0], ancre: [XS + 0.45, D + 0.55, 0],
  texte: "Petite loupe qui grossit l'image formée au foyer par le primaire. On change d'oculaire pour changer de grossissement.",
  chiffres: "Grossissement = focale du télescope ÷ focale de l'oculaire",
  extra: () => `
    <div class="calc"><label for="ocu">Oculaire de</label>
      <select id="ocu">${[32, 25, 15, 10, 6].map((f) => `<option value="${f}" ${f === ocular ? "selected" : ""}>${f} mm</option>`).join("")}</select>
      <span>→ 1000 ÷ ${ocular} = <strong>${Math.round(1000 / ocular)}×</strong></span></div>
    <p class="spec">Grossissement utile maximal ≈ 2 × diamètre en mm, soit ≈ 400× (rarement atteint à cause de la turbulence).</p>`,
  bind: (root) => root.querySelector("#ocu").addEventListener("change", (e) => { ocular = +e.target.value; S.refreshInfo(); }),
});
{
  S.add(eyepiece, mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.4, 32, 1, true), M.alu(), XS, D + 0.15, 0)).material.side = THREE.DoubleSide;
  S.add(eyepiece, mesh(new THREE.CylinderGeometry(0.3, 0.27, 0.6, 32, 1, true), M.noir(), XS, D + 0.65, 0)).material.side = THREE.DoubleSide;
  S.add(eyepiece, mesh(new THREE.CylinderGeometry(0.29, 0.31, 0.22, 32, 1, true), M.caoutchouc(), XS, D + 1.06, 0)).material.side = THREE.DoubleSide;
  S.add(eyepiece, mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.05, 32), M.lentille(), XS, D + FE, 0));
}

// ---------- Chercheur ----------
const FY = (RT + 0.5) * Math.SQRT1_2, FZ = -(RT + 0.5) * Math.SQRT1_2;
const finder = S.part("finder", "Chercheur", {
  eclate: [0, 1.2, -1.6], ancre: [2.3, FY + 0.3, FZ],
  texte: "Petite lunette à faible grossissement (×6 à ×9) et à grand champ, alignée avec le tube. Elle sert à viser l'objet avant de regarder dans l'oculaire du télescope, dont le champ est très étroit.",
  chiffres: "Typiquement 8×50 : grossissement 8, objectif de 50 mm",
});
{
  S.add(finder, mesh(axeX(new THREE.CylinderGeometry(0.2, 0.2, 1.8, 32)), M.peinture(), 2.3, FY, FZ));
  S.add(finder, mesh(axeX(new THREE.CylinderGeometry(0.26, 0.2, 0.35, 32)), M.peinture(), 3.35, FY, FZ));
  S.add(finder, mesh(axeX(new THREE.CylinderGeometry(0.1, 0.14, 0.35, 24)), M.noir(), 1.25, FY, FZ));
  for (const x of [1.8, 2.8]) {
    S.add(finder, mesh(axeX(new THREE.TorusGeometry(0.26, 0.04, 8, 32).rotateX(Math.PI / 2)), M.noir(), x, FY, FZ));
    const foot = S.add(finder, mesh(new THREE.BoxGeometry(0.1, 0.36, 0.1), M.noir(), x, (RT + 0.12) * Math.SQRT1_2 + 0.1, -(RT + 0.12) * Math.SQRT1_2 - 0.1));
    foot.rotation.x = Math.PI / 4;
  }
}

// ---------- Colliers ----------
const rings = S.part("rings", "Colliers", {
  eclate: [0, -2.9, 0], ancre: [-2.6, -RT - 0.15, 0.9],
  texte: "Ils serrent le tube et le relient à la queue d'aronde. Desserrés, ils permettent de faire tourner le tube sur lui-même pour placer l'oculaire dans une position confortable, ou de le faire glisser pour l'équilibrer sur la monture.",
  chiffres: "Paire de colliers à charnière, molettes de serrage",
});
for (const x of [-2.6, 1.9]) {
  S.add(rings, mesh(axeX(new THREE.CylinderGeometry(RT + 0.07, RT + 0.07, 0.3, 72, 1, true)), M.noir(), x)).material.side = THREE.DoubleSide;
  S.add(rings, mesh(new THREE.BoxGeometry(0.3, 0.32, 0.5), M.noir(), x, -RT - 0.22, 0));
  S.add(rings, mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.4, 12), M.alu(), x, RT + 0.2, 0));
}

// ---------- Queue d'aronde ----------
const dovetail = S.part("dovetail", "Queue d'aronde", {
  eclate: [0, -3.7, 0], ancre: [-0.4, -RT - 0.5, 0.45],
  texte: "Barre profilée standardisée qui se glisse et se serre dans la tête de la monture. C'est l'interface entre le télescope et sa monture.",
  chiffres: "Format Vixen (≈ 44 mm) ou Losmandy (≈ 75 mm)",
});
{
  const s = new THREE.Shape();
  s.moveTo(-0.38, 0); s.lineTo(0.38, 0); s.lineTo(0.3, -0.16); s.lineTo(-0.3, -0.16); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 6.4, bevelEnabled: false });
  g.rotateY(Math.PI / 2);
  S.add(dovetail, mesh(g, M.alu(), -3.6, -RT - 0.38, 0));
}

// ---------- Trajet de la lumière ----------
const P = new THREE.Vector3(XP + F, 0, 0);   // foyer du primaire seul
const P2 = new THREE.Vector3(XS, D, 0);      // foyer renvoyé par le secondaire
const entries = [[0.85, 0], [-0.85, 0], [0.5, 0], [-0.5, 0], [0, 0.72], [0, -0.72]];
const rays = entries.map(([y0, z0]) => {
  const A = new THREE.Vector3(TUBE_FRONT + 4.5, y0, z0);
  const H = new THREE.Vector3(XP + (y0 * y0 + z0 * z0) / (4 * F), y0, z0);
  const dir = P.clone().sub(H);
  const t = (XS - H.x + H.y) / (dir.x - dir.y);
  const Sp = H.clone().addScaledVector(dir, t);
  const out = P2.clone().sub(Sp);
  const L = Sp.clone().addScaledVector(out, (D + FE - Sp.y) / out.y);
  const E = L.clone().add(new THREE.Vector3(0, 1.3, 0));
  const pts = [A, H, Sp, L, E];
  const lens = []; let total = 0;
  for (let i = 0; i < pts.length - 1; i++) { const l = pts[i].distanceTo(pts[i + 1]); lens.push(l); total += l; }
  return { pts, lens, total };
});

const light = new THREE.Group();
S.scene.add(light);
{
  const pos = [], col = [], c = new THREE.Color();
  for (const r of rays) for (let i = 0; i < r.pts.length - 1; i++) {
    c.setHex(SEG[i]);
    pos.push(...r.pts[i].toArray(), ...r.pts[i + 1].toArray());
    col.push(c.r, c.g, c.b, c.r, c.g, c.b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  light.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false })));
}
const PER_RAY = 5;
const photonGeo = new THREE.BufferGeometry();
photonGeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(rays.length * PER_RAY * 3), 3));
photonGeo.setAttribute("color", new THREE.BufferAttribute(new Float32Array(rays.length * PER_RAY * 3), 3));
const photons = new THREE.Points(photonGeo, new THREE.PointsMaterial({ size: 0.42, map: textureHalo(), vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
photons.frustumCulled = false;
light.add(photons);
const focusMark = new THREE.Sprite(new THREE.SpriteMaterial({ map: textureHalo(), color: COULEURS.corail, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
focusMark.position.copy(P2); focusMark.scale.setScalar(0.55);
light.add(focusMark);

const tmpC = new THREE.Color();
function updatePhotons(time) {
  const pos = photonGeo.attributes.position, col = photonGeo.attributes.color;
  let k = 0;
  for (const r of rays) {
    for (let j = 0; j < PER_RAY; j++, k++) {
      let s = ((time * 3.2) + j * r.total / PER_RAY) % r.total;
      let i = 0;
      while (i < r.lens.length - 1 && s > r.lens[i]) { s -= r.lens[i]; i++; }
      const a = r.pts[i], b = r.pts[i + 1], f = Math.min(1, s / r.lens[i]);
      pos.setXYZ(k, a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, a.z + (b.z - a.z) * f);
      tmpC.setHex(SEG[i]);
      col.setXYZ(k, tmpC.r, tmpC.g, tmpC.b);
    }
  }
  pos.needsUpdate = true; col.needsUpdate = true;
}

const lightVisible = () => S.state.lumiere && S.state.explode < 0.01;
S.label("Lumière d'une étoile", () => new THREE.Vector3(TUBE_FRONT + 3.2, 0.95, 0), { lumiere: true, visible: lightVisible });
S.label("Foyer", () => P2.clone().add(new THREE.Vector3(-0.45, 0.12, 0)), { lumiere: true, visible: lightVisible });
S.label("Vers l'œil", () => new THREE.Vector3(XS, D + FE + 1.45, 0), { lumiere: true, visible: lightVisible });

S.onFrame(({ time }) => {
  const vis = lightVisible();
  light.visible = vis;
  S.notice(S.state.lumiere && !vis ? "Rassemblez les pièces (éclaté à 0 %) pour voir le trajet de la lumière." : null);
  photons.visible = S.state.anim || S.reduced;
  if (vis) updatePhotons(time);
});

S.start();
</script>
</body>
</html>
